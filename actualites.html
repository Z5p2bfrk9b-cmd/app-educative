<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EPPIA - Actualités et Histoire</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Nunito', sans-serif; }

        body {
            background: #f5f5f5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            max-width: 500px;
            margin: 0 auto;
            padding-bottom: 80px;
        }

        /* HEADER (identique à ta page actualités) */
        .header-title-row{
            background: #7ac70c;
            padding: 34px 16px 20px;
            border-radius: 0 0 24px 24px;
        }
        .header-title {
            font-size: 22px;
            font-weight: 900;
            color: #fff;
            margin-bottom: 4px;
        }
        .header-sub {
            font-size: 12px;
            color: rgba(255,255,255,0.85);
            font-weight: 700;
        }

        /* CHOIX : 2 GRANDES PILULES */
        .choix {
            flex: 1;
            display: flex;
            gap: 14px;
            padding: 22px 14px 18px;
        }

        .pilule {
            flex: 1;
            min-width: 0;
            min-height: 470px;
            border-radius: 36px;
            border: 8px solid var(--bord);
            background: var(--fond);
            color: #fff;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 22px 10px 22px;
            /* effet "bouton en relief" façon Duolingo */
            box-shadow: 0 8px 0 var(--ombre);
            transition: transform 0.1s, box-shadow 0.1s;
        }
        .pilule:active { transform: translateY(6px); box-shadow: 0 2px 0 var(--ombre); }
        .pilule:focus-visible { outline: 4px solid #0000cc; outline-offset: 4px; }

        .pilule-titre {
            font-size: 23px;
            font-weight: 900;
            margin-bottom: 14px;
        }

        .actus    { --bord: #bff199; --fond: #8ee000; --ombre: #2c6320; --accent: #00a060; }
        .histoire { --bord: #1cb0f6; --fond: #14d4f4; --ombre: #365a78; --accent: #46759a; }

        /* CARTES D'APERÇU */
        .cartes {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: auto;   /* pousse le coq et le bouton en bas de la pilule */
        }
        .carte {
            background: #fff;
            color: #222;
            border-radius: 16px;
            border: 2px solid rgba(0,0,0,0.08);
            border-bottom-width: 4px;
            overflow: hidden;
            text-align: left;
        }
        .vignette {
            height: 74px;
            background-size: cover;
            background-position: center;
            background-color: var(--fond);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .vignette.vide { background: linear-gradient(135deg, var(--bord), var(--fond)); }
        .vignette svg {
            width: 30px; height: 30px;
            stroke: #fff; fill: none; stroke-width: 1.8;
            stroke-linecap: round; stroke-linejoin: round;
        }
        .carte-corps { padding: 8px 10px 10px; }
        .carte-tag {
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--accent);
            margin-bottom: 2px;
        }
        .carte-titre {
            font-size: 12.5px;
            font-weight: 800;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .carte-pied {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
            margin-top: 6px;
            font-size: 10px;
            font-weight: 700;
            color: #888;
        }
        .chip-credit {
            background: #e8faf2;
            color: #00a060;
            font-size: 10px;
            font-weight: 800;
            padding: 2px 8px;
            border-radius: 20px;
            white-space: nowrap;
        }
        .barre {
            height: 8px;
            border-radius: 5px;
            background: #e5e5e5;
            margin-top: 8px;
            overflow: hidden;
        }
        .barre > div { height: 100%; background: #46759a; border-radius: 5px; }

        /* BOUTON ROND EN RELIEF */
        .pilule-go {
            margin-top: 12px;
            width: 56px;
            height: 56px;
            border-radius: 18px;
            background: #fff;
            border-bottom: 5px solid rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .pilule-go svg {
            width: 26px; height: 26px;
            stroke: var(--fond); fill: none; stroke-width: 3.2;
            stroke-linecap: round; stroke-linejoin: round;
        }
        .pilule:hover .pilule-go { transform: scale(1.06); }
        .pilule-go { transition: transform 0.15s; }

        /* COQ + BULLE (pilule Histoire) */
        .coq-zone {
            margin-top: 12px;
            width: 100%;
            display: none;               /* affiché seulement si l'image du coq existe */
            flex-direction: column;
            align-items: center;
        }
        .coq-zone.visible { display: flex; }
        .bulle {
            position: relative;
            background: #fff;
            color: #222;
            font-size: 13px;
            font-weight: 800;
            line-height: 1.3;
            text-align: center;
            padding: 10px 14px;
            border-radius: 12px;
            border: 2px solid rgba(0,0,0,0.1);
            border-bottom-width: 4px;
            margin-bottom: 12px;
            animation: flotte 2.4s ease-in-out infinite;
        }
        .bulle::after {
            content: "";
            position: absolute;
            left: 50%;
            bottom: -8px;
            width: 12px; height: 12px;
            background: #fff;
            transform: translateX(-50%) rotate(45deg);
            border-right: 2px solid rgba(0,0,0,0.1);
            border-bottom: 2px solid rgba(0,0,0,0.1);
        }
        .coq-zone img { width: 84px; height: auto; display: block; }
        @keyframes flotte {
            0%, 100% { transform: translateY(0); }
            50%      { transform: translateY(-4px); }
        }
        @media (prefers-reduced-motion: reduce) { .bulle { animation: none; } }

        /* SÉRIE DE JOURS (affichée seulement si 'serie_jours' existe) */
        .header-title-row { position: relative; }
        .serie {
            display: none;
            position: absolute;
            top: 30px; right: 16px;
            align-items: center;
            gap: 5px;
            background: rgba(255,255,255,0.25);
            color: #fff;
            font-size: 14px;
            font-weight: 900;
            padding: 5px 10px;
            border-radius: 20px;
        }
        .serie.visible { display: flex; }
        .serie svg { width: 16px; height: 16px; fill: #fff; }

        /* NAV (identique à ta page actualités) */
        .nav {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 500px;
            background: #fff;
            border-top: 1px solid #eee;
            display: flex;
            justify-content: space-around;
            padding: 10px 0 16px;
            z-index: 100;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            padding: 6px 10px;
            border-radius: 12px;
            cursor: pointer;
            text-decoration: none;
        }
        .nav-item.active { background: #f0f0ff; }
        .nav-icon svg {
            width: 22px;
            height: 22px;
            stroke: #bbb;
            fill: none;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .nav-item.active svg { stroke: #0000cc; }
        .nav-label { font-size: 9px; font-weight: 700; color: #bbb; }
        .nav-item.active .nav-label { color: #0000cc; }
    </style>
</head>
<body>

    <div class="header-title-row">
        <div class="header-title">Actualités &amp; Histoire</div>
        <div class="header-sub">Choisis ce que tu veux découvrir aujourd'hui</div>
        <div class="serie" id="serie" aria-label="Série de jours"><svg viewBox="0 0 24 24"><path d="M12 2c1 3.5 5 5.5 5 10a5 5 0 01-10 0c0-1.7.7-3 1.6-4 .2 1.2.9 2 1.9 2.2C10 7 10.7 4 12 2z"/></svg><span id="serieNb">0</span></div>
    </div>

    <div class="choix">

        <a class="pilule actus" href="actus.html" aria-label="Lire les actualités">
            <div class="pilule-titre">Actualités</div>
            <div class="cartes" id="cartesActus"></div>
            <div class="pilule-go" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></div>
        </a>

        <a class="pilule histoire" href="histoire.html" aria-label="Continuer l'histoire">
            <div class="pilule-titre">Histoire</div>
            <div class="cartes" id="cartesHistoire"></div>
            <div class="coq-zone" id="coqZone">
                <div class="bulle" id="bulleCoq">On continue ?</div>
                <img id="coqImg" alt="" src="">
            </div>
            <div class="pilule-go" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></div>
        </a>

    </div>

    <!-- NAV -->
    <div class="nav">
        <a class="nav-item" href="accueil.html">
            <div class="nav-icon">
                <svg viewBox="0 0 24 24">
                    <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
                    <polyline points="9 22 9 12 15 12 15 22"/>
                </svg>
            </div>
            <div class="nav-label">Accueil</div>
        </a>
        <a class="nav-item active" href="actualites.html">
            <div class="nav-icon">
                <svg viewBox="0 0 24 24">
                    <path d="M4 22h16a2 2 0 002-2V4a2 2 0 00-2-2H8a2 2 0 00-2 2v16a2 2 0 01-2 2zm0 0a2 2 0 01-2-2v-9c0-1.1.9-2 2-2h2"/>
                    <path d="M18 14h-8M15 18h-5M10 6h8v4h-8z"/>
                </svg>
            </div>
            <div class="nav-label">Actualité</div>
        </a>
        <a class="nav-item" href="progression.html">
            <div class="nav-icon">
                <svg viewBox="0 0 24 24">
                    <line x1="18" y1="20" x2="18" y2="10"/>
                    <line x1="12" y1="20" x2="12" y2="4"/>
                    <line x1="6" y1="20" x2="6" y2="14"/>
                </svg>
            </div>
            <div class="nav-label">Progrès</div>
        </a>
        <a class="nav-item" href="jeux.html">
            <div class="nav-icon">
                <svg viewBox="0 0 24 24">
                    <path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/>
                    <circle cx="9" cy="7" r="4"/>
                    <path d="M23 21v-2a4 4 0 00-3-3.87"/>
                    <path d="M16 3.13a4 4 0 010 7.75"/>
                </svg>
            </div>
            <div class="nav-label">Jeux</div>
        </a>
        <a class="nav-item" href="profil.html">
            <div class="nav-icon">
                <svg viewBox="0 0 24 24">
                    <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
                    <circle cx="12" cy="7" r="4"/>
                </svg>
            </div>
            <div class="nav-label">Profil</div>
        </a>
    </div>

    <script>
        const ICONE_JOURNAL = '<svg viewBox="0 0 24 24"><path d="M4 22h16a2 2 0 002-2V4a2 2 0 00-2-2H8a2 2 0 00-2 2v16a2 2 0 01-2 2zm0 0a2 2 0 01-2-2v-9c0-1.1.9-2 2-2h2"/><path d="M18 14h-8M15 18h-5M10 6h8v4h-8z"/></svg>';
        const ICONE_LIVRE   = '<svg viewBox="0 0 24 24"><path d="M2 4h6a4 4 0 014 4v13a3 3 0 00-3-3H2z"/><path d="M22 4h-6a4 4 0 00-4 4v13a3 3 0 013-3h7z"/></svg>';

        function echapper(t){ const d = document.createElement('div'); d.textContent = t; return d.innerHTML; }

        // Une vignette : image si on en a une, sinon un dégradé avec une icône
        function vignette(image, icone){
            if (image) {
                return '<div class="vignette" style="background-image:url(\'' + encodeURI(image) + '\')"></div>';
            }
            return '<div class="vignette vide">' + icone + '</div>';
        }

        // ---- Dernières actualités ----
        // "image" : mets le lien d'une image que tu as le droit d'utiliser (la tienne,
        // ou une image libre de droits). Laisse null pour afficher le dégradé.
        // Plus tard, ce tableau viendra de Supabase.
        const dernieresActus = [
            { tag: "SVT", titre: "CRISPR : une avancée majeure dans le traitement des maladies génétiques", date: "Il y a 2 h", image: null },
            { tag: "Histoire-Géo", titre: "Rapport GIEC 2026 : les écosystèmes marins en danger", date: "Il y a 5 h", image: null }
        ];

        document.getElementById('cartesActus').innerHTML = dernieresActus.map(a =>
            '<div class="carte">' +
                vignette(a.image, ICONE_JOURNAL) +
                '<div class="carte-corps">' +
                    '<div class="carte-tag">' + echapper(a.tag) + '</div>' +
                    '<div class="carte-titre">' + echapper(a.titre) + '</div>' +
                    '<div class="carte-pied"><span>' + echapper(a.date) + '</span><span class="chip-credit">+1 crédit</span></div>' +
                '</div>' +
            '</div>'
        ).join('');

        // ---- Dernière histoire lue ----
        // La page histoire enregistrera :
        // localStorage.setItem('histoire_derniere', JSON.stringify({chapitre: 3, titre: "...", progression: 60, image: null}));
        let derniere = null;
        try { derniere = JSON.parse(localStorage.getItem('histoire_derniere')); } catch (e) {}

        const zoneHistoire = document.getElementById('cartesHistoire');
        if (derniere && derniere.titre) {
            const prog = Math.max(0, Math.min(100, Number(derniere.progression) || 0));
            zoneHistoire.innerHTML =
                '<div class="carte">' +
                    vignette(derniere.image, ICONE_LIVRE) +
                    '<div class="carte-corps">' +
                        '<div class="carte-tag">Reprendre · Chapitre ' + echapper(String(derniere.chapitre || 1)) + '</div>' +
                        '<div class="carte-titre">' + echapper(derniere.titre) + '</div>' +
                        '<div class="barre"><div style="width:' + prog + '%"></div></div>' +
                        '<div class="carte-pied"><span>' + prog + ' % lu</span></div>' +
                    '</div>' +
                '</div>';
        } else {
            zoneHistoire.innerHTML =
                '<div class="carte">' +
                    vignette(null, ICONE_LIVRE) +
                    '<div class="carte-corps">' +
                        '<div class="carte-tag">À découvrir</div>' +
                        '<div class="carte-titre">Commence ton aventure : le chapitre 1 t\'attend.</div>' +
                    '</div>' +
                '</div>';
        }

        // ---- Coq (mets ici le chemin de ton image du coq) ----
        const COQ_SRC = 'images/coq.png';
        const coqImg = document.getElementById('coqImg');
        coqImg.onload  = () => document.getElementById('coqZone').classList.add('visible');
        coqImg.onerror = () => document.getElementById('coqZone').classList.remove('visible');
        coqImg.src = COQ_SRC;

        // ---- Série de jours (optionnelle) ----
        // Pour l'activer, ton appli enregistre : localStorage.setItem('serie_jours', 3);
        try {
            const nb = parseInt(localStorage.getItem('serie_jours'), 10);
            if (nb > 0) {
                document.getElementById('serieNb').textContent = nb;
                document.getElementById('serie').classList.add('visible');
            }
        } catch (e) {}
    </script>

</body>
</html>
