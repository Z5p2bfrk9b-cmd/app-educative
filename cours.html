        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Nunito', sans-serif; }

        body {
            background: #f5f5f5;

            display: flex;

            margin: 0 auto;
            padding-bottom: 80px;

        /* HEADER */
        .header {
            background: #6B9FE4;
            padding: 16px 14px 20px;

        }

        .header-top {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 14px;
        }

        .back-btn {
            background: rgba(255,255,255,0.25);
            border: none;
            border-radius: 12px;
            padding: 8px 12px;
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            font-weight: 900;
            text-decoration: none;
            display: flex;
            align-items: center;
        }



        .subject-title {
            font-size: 22px;
            font-weight: 900;
            color: #fff;
        }

        .subject-sub {
            font-size: 12px;
            color: rgba(255,255,255,0.75);
            font-weight: 700;
        }

        /* SECTION */
        .section-title {
            padding: 20px 16px 12px;
            font-size: 15px;
            font-weight: 800;
            color: #222;
        }

        /* BULLES CHAPITRES */
        .chapitres {
            padding: 0 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
.chapitre {
    border-radius: 16px;
    padding: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    width: 160px;
    height: 160px;
    min-width: 160px;
    max-width: 160px;
    min-height: 160px;
    max-height: 160px;
    transition: transform 0.15s, box-shadow 0.15s;
    border: none;
    overflow: hidden;
    text-align: center;
    box-shadow: 0 12px 24px rgba(0,0,0,0.25), 
                inset 0 -4px 8px rgba(0,0,0,0.15);
    position: relative;
}

.chapitre::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: radial-gradient(ellipse 70% 35% at 50% 0%, rgba(255,255,255,0.4) 0%, transparent 65%);
    border-radius: 16px;
    pointer-events: none;
    z-index: 1;
}

.chapitre:hover {
    box-shadow: 0 16px 32px rgba(0,0,0,0.3), 
                inset 0 -4px 8px rgba(0,0,0,0.15);
    transform: translateY(-4px);
}

.chapitre:active { transform: scale(0.97); }

.chapitre-emoji {
    font-size: 50px;
    margin-bottom: 8px;
    position: relative;
    z-index: 2;
}

.chapitre-name {
    font-size: 11px;
    font-weight: 800;
    color: #333;
    line-height: 1.3;
    word-break: break-word;
    position: relative;
    z-index: 2;
}



        

        /* NAV */
        .nav {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 500px;
            background: #fff;
            border-top: 1px solid #eee;
            display: flex;
            justify-content: space-around;
            padding: 10px 0 16px;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            padding: 6px 10px;
            border-radius: 12px;
            cursor: pointer;
            text-decoration: none;
        }

        .nav-item.active { background: #f0f0ff; }

        .nav-icon svg {
            width: 22px;
            height: 22px;
            stroke: #bbb;
            fill: none;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .nav-item.active svg { stroke: #0000cc; }
        .nav-label { font-size: 9px; font-weight: 700; color: #bbb; }
        .nav-item.active .nav-label { color: #0000cc; }
    </style>
</head>
