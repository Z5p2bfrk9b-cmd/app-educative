<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EPPIA - Cours</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Nunito', sans-serif; }

        body {
            background: #f5f5f5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            max-width: 500px;
            margin: 0 auto;
            padding-bottom: 80px;
        }

        /* HEADER */
        .header {
            background: #6B9FE4;
            padding: 16px 14px 20px;
            border-radius: 0 0 28px 28px;
        }

        .header-top {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 14px;
        }

        .back-btn {
            background: rgba(255,255,255,0.25);
            border: none;
            border-radius: 12px;
            padding: 8px 12px;
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            font-weight: 900;
            text-decoration: none;
            display: flex;
            align-items: center;
        }

        .subject-title {
            font-size: 22px;
            font-weight: 900;
            color: #fff;
        }

        .subject-sub {
            font-size: 12px;
            color: rgba(255,255,255,0.75);
            font-weight: 700;
        }

        /* SECTION */
        .section-title {
            padding: 20px 16px 12px;
            font-size: 15px;
            font-weight: 800;
            color: #222;
        }

        /* BULLES CHAPITRES */
        .chapitres {
            padding: 0 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .chapitre {
            border-radius: 16px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            width: 160%;
            height: 160px;
            min-width: 160px;
            max-width: 160px;
            min-height: 160px;
            max-height: 160px;
            transition: transform 0.15s, box-shadow 0.15s;
            border: none;
            overflow: hidden;
            text-align: center;
        }

        .chapitre:nth-child(1) { align-self: flex-start; background: #f39f39; }
        .chapitre:nth-child(2) { align-self: flex-end; background: #fff1a7; }
        .chapitre:nth-child(3) { align-self: flex-start; background: #b890ff; }
        .chapitre:nth-child(4) { align-self: flex-end; background: #ed98cf; }
        .chapitre:nth-child(5) { align-self: flex-start; background: #64a9fd; }
        .chapitre:nth-child(6) { 
            align-self: flex-end; 
            background-color: #ffffff; 
            background-image: radial-gradient(#000000 20%,transparent 20%); 
            background-size: 40px 40px; 
        }
        .chapitre:nth-child(7) { align-self: flex-start; background: #b8447e; }
        .chapitre:nth-child(8) { align-self: flex-end; background: #850606; }
        .chapitre:nth-child(9) { align-self: flex-start; background: #1100f7; }
        .chapitre:nth-child(10) { align-self: flex-end; background: #000000; }
        .chapitre:nth-child(11) { align-self: flex-start; background: #f5cee8; }
        .chapitre:nth-child(12) { align-self: flex-end; background: #472370; }
        .chapitre:nth-child(13) { align-self: flex-start; background: #142a66; }
        .chapitre:nth-child(14) { align-self: flex-end; background: #d4fae8; }
        .chapitre:nth-child(15) { align-self: flex-start; background: #fafad4; }
        .chapitre:nth-child(16) { align-self: flex-end; background: #d4d4fa; }
        .chapitre:nth-child(17) { align-self: flex-start; background: #fae0d4; }
        .chapitre:nth-child(18) { align-self: flex-end; background: #d4faed; }
        .chapitre:nth-child(19) { align-self: flex-start; background: #ead4fa; }
        .chapitre:nth-child(20) { align-self: flex-end; background: #fad4ea; }

        .chapitre:hover {
            box-shadow: 0 6px 20px rgba(0,0,0,0.1);
            transform: translateY(-2px);
        }

        .chapitre:active { transform: scale(0.97); }

        .chapitre-name {
            font-size: 11px;
            font-weight: 800;
            color: #333;
            line-height: 1.3;
            word-break: break-word;
        }

        .chapitre-arrow {
            display: none;
        }

        /* NAV */
        .nav {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 500px;
            background: #fff;
            border-top: 1px solid #eee;
            display: flex;
            justify-content: space-around;
            padding: 10px 0 16px;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            padding: 6px 10px;
            border-radius: 12px;
            cursor: pointer;
            text-decoration: none;
        }

        .nav-item.active { background: #f0f0ff; }

        .nav-icon svg {
            width: 22px;
            height: 22px;
            stroke: #bbb;
            fill: none;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .nav-item.active svg { stroke: #0000cc; }
        .nav-label { font-size: 9px; font-weight: 700; color: #bbb; }
        .nav-item.active .nav-label { color: #0000cc; }
    </style>
</head>
<body>

    <!-- HEADER -->
    <div class="header">
        <div class="header-top">
            <a class="back-btn" href="accueil.html">←</a>
            <div>
                <div class="subject-title">Mathématiques</div>
                <div class="subject-sub">Choisis un chapitre</div>
            </div>
        </div>
    </div>

    <!-- CHAPITRES -->
    <div class="section-title">Chapitres 📖</div>

    <div class="chapitres">

        <div class="chapitre" onclick="window.location.href='ia.html'">
            <div class="chapitre-name">Les fractions</div>
            <div class="chapitre-arrow">›</div>
        </div>

        <div class="chapitre" onclick="window.location.href='ia.html'">
            <div class="chapitre-name">Les équations</div>
            <div class="chapitre-arrow">›</div>
        </div>

        <div class="chapitre" onclick="window.location.href='ia.html'">
            <div class="chapitre-name">La géométrie</div>
            <div class="chapitre-arrow">›</div>
        </div>

        <div class="chapitre" onclick="window.location.href='ia.html'">
            <div class="chapitre-name">Les statistiques</div>
            <div class="chapitre-arrow">›</div>
        </div>

        <div class="chapitre" onclick="window.location.href='ia.html'">
            <div class="chapitre-name">Les fonctions</div>
            <div class="chapitre-arrow">›</div>
        </div>

        <div class="chapitre" onclick="window.location.href='ia.html'">
            <div class="chapitre-name">Trigonométrie</div>
            <div class="chapitre-arrow">›</div>
        </div>

        <div class="chapitre" onclick="window.location.href='ia.html'">
            <div class="chapitre-name">Les probabilités</div>
            <div class="chapitre-arrow">›</div>
        </div>

        <div class="chapitre" onclick="window.location.href='ia.html'">
            <div class="chapitre-name">Calcul littéral</div>
            <div class="chapitre-arrow">›</div>
        </div>

    </div>

    <!-- NAV -->
    <div class="nav">
        <a class="nav-item active" href="accueil.html">
            <div class="nav-icon">
                <svg viewBox="0 0 24 24">
                    <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
                    <polyline points="9 22 9 12 15 12 15 22"/>
                </svg>
            </div>
            <div class="nav-label">Accueil</div>
        </a>
        <a class="nav-item" href="actualites.html">
            <div class="nav-icon">
                <svg viewBox="0 0 24 24">
                    <path d="M4 22h16a2 2 0 002-2V4a2 2 0 00-2-2H8a2 2 0 00-2 2v16a2 2 0 01-2 2zm0 0a2 2 0 01-2-2v-9c0-1.1.9-2 2-2h2"/>
                    <path d="M18 14h-8M15 18h-5M10 6h8v4h-8z"/>
                </svg>
            </div>
            <div class="nav-label">Actualité</div>
        </a>
        <a class="nav-item" href="progression.html">
            <div class="nav-icon">
                <svg viewBox="0 0 24 24">
                    <line x1="18" y1="20" x2="18" y2="10"/>
                    <line x1="12" y1="20" x2="12" y2="4"/>
                    <line x1="6" y1="20" x2="6" y2="14"/>
                </svg>
            </div>
            <div class="nav-label">Progrès</div>
        </a>
        <a class="nav-item" href="livres.html">
            <div class="nav-icon">
                <svg viewBox="0 0 24 24">
                    <path d="M4 19.5A2.5 2.5 0 016.5 17H20"/>
                    <path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/>
                </svg>
            </div>
            <div class="nav-label">Livres</div>
        </a>
        <a class="nav-item" href="profil.html">
            <div class="nav-icon">
                <svg viewBox="0 0 24 24">
                    <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
                    <circle cx="12" cy="7" r="4"/>
                </svg>
            </div>
            <div class="nav-label">Profil</div>
        </a>
    </div>


</body>
</html>
