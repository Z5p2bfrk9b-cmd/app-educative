<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EPPIA - Cours</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap');
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Nunito', sans-serif;
        }
        body {
            background: #f5f5f5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            max-width: 500px;
            margin: 0 auto;
            padding-bottom: 80px;
        }
        /* =====================================================
           HEADER
        ===================================================== */
        .header {
            background: #6B9FE4;
            padding: 16px 14px 20px;
            border-radius: 0 0 28px 28px;
        }
        .header-top {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 14px;
        }
        .back-btn {
            background: rgba(255,255,255,0.25);
            border: none;
            border-radius: 12px;
            padding: 8px 12px;
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            font-weight: 900;
            text-decoration: none;
            display: flex;
            align-items: center;
        }
        .subject-title {
            font-size: 22px;
            font-weight: 900;
            color: #fff;
        }
        .subject-sub {
            font-size: 12px;
            color: rgba(255,255,255,0.75);
            font-weight: 700;
        }
        /* =====================================================
           TITRE
        ===================================================== */
        .section-title {
            padding: 20px 16px 12px;
            font-size: 15px;
            font-weight: 800;
            color: #222;
        }
        /* =====================================================
           CHAPITRES
        ===================================================== */
        .chapitres {
            padding: 0 16px;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }
        /* =====================================================
           BULLE
        ===================================================== */
        .chapitre {
            width: 160px;
            height: 160px;
            border-radius: 28px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            text-align: center;
            border: 2px solid rgba(255,255,255,0.5);
            /*
                Ombre principale + profondeur
            */
            box-shadow:
                0 8px 0 rgba(0,0,0,0.12),
                0 12px 25px rgba(0,0,0,0.12);
            transition:
                transform 0.15s ease,
                box-shadow 0.15s ease;
        }
        /* =====================================================
           REFLET GLACÉ
        ===================================================== */
        .chapitre::before {
            content: "";
            position: absolute;
            top: 7px;
            left: 10px;
            width: 80%;
            height: 48%;
            background: linear-gradient(
                135deg,
                rgba(255,255,255,0.58),
                rgba(255,255,255,0.12)
            );
            border-radius: 50%;
            transform: rotate(-8deg);
            pointer-events: none;
            z-index: 1;
        }
        /* =====================================================
           LIGNE DE LUMIÈRE
        ===================================================== */
        .chapitre::after {
            content: "";
            position: absolute;
            top: 4px;
            left: 9px;
            right: 9px;
            height: 45%;
            border-radius: 24px;
            border-top: 3px solid rgba(255,255,255,0.6);
            pointer-events: none;
            z-index: 1;
        }
        /* =====================================================
           CONTENU DE LA BULLE
        ===================================================== */
        .chapitre svg,
        .chapitre-name {
            position: relative;
            z-index: 2;
        }
        .chapitre svg {
            margin-bottom: 8px;
            filter: drop-shadow(0 2px 1px rgba(0,0,0,0.08));
        }
        .chapitre-name {
            font-size: 11px;
            font-weight: 900;
            color: #333;
            line-height: 1.3;
            word-break: break-word;
            padding: 0 10px;
        }
        /* =====================================================
           ALIGNEMENT ALTERNÉ
        ===================================================== */
        .chapitre:nth-child(1) {
            align-self: flex-start;
        }
        .chapitre:nth-child(2) {
            align-self: flex-end;
        }
        .chapitre:nth-child(3) {
            align-self: flex-start;
        }
        .chapitre:nth-child(4) {
            align-self: flex-end;
        }
        .chapitre:nth-child(5) {
            align-self: flex-start;
        }
        .chapitre:nth-child(6) {
            align-self: flex-end;
        }
        .chapitre:nth-child(7) {
            align-self: flex-start;
        }
        .chapitre:nth-child(8) {
            align-self: flex-end;
        }
        /* =====================================================
           ANIMATION AU SURVOL
        ===================================================== */
        .chapitre:hover {
            transform: translateY(-5px);
            box-shadow:
                0 10px 0 rgba(0,0,0,0.12),
                0 18px 30px rgba(0,0,0,0.16);
        }
        /* =====================================================
           ANIMATION AU CLIC
        ===================================================== */
        .chapitre:active {
            transform: translateY(3px);
            box-shadow:
                0 3px 0 rgba(0,0,0,0.12),
                0 6px 12px rgba(0,0,0,0.12);
        }
        /* =====================================================
           NAVIGATION
        ===================================================== */
        .nav {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 500px;
            background: #fff;
            border-top: 1px solid #eee;
            display: flex;
            justify-content: space-around;
            padding: 10px 0 16px;
            z-index: 20;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            padding: 6px 10px;
            border-radius: 12px;
            cursor: pointer;
            text-decoration: none;
        }
        .nav-item.active {
            background: #f0f0ff;
        }
        .nav-icon svg {
            width: 22px;
            height: 22px;
            stroke: #bbb;
            fill: none;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .nav-item.active svg {
            stroke: #0000cc;
        }
        .nav-label {
            font-size: 9px;
            font-weight: 700;
            color: #bbb;
        }
        .nav-item.active .nav-label {
            color: #0000cc;
        }
    </style>
</head>
