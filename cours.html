        /* CHAPITRES */
        
       .chapitres {
    display: flex;

}

.chapitre-container {
    width: 160px;
}

.chapitre-container:nth-child(1) { align-self: flex-start; }
.chapitre-container:nth-child(2) { align-self: flex-end; }
.chapitre-container:nth-child(3) { align-self: flex-start; }
.chapitre-container:nth-child(4) { align-self: flex-end; }

.chapitre-container:nth-child(6) { align-self: flex-end; }
.chapitre-container:nth-child(7) { align-self: flex-start; }
.chapitre-container:nth-child(8) { align-self: flex-end; }


     

        /* BOUTONS RONDS */

        .chapitre {
            position: relative;

            width: 135px;
            height: 135px;

            border: none;
            border-radius: 28%;

            cursor: pointer;
            outline: none;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;

            background: radial-gradient(
                circle at 50% 25%,
                var(--light) 0%,
                var(--main) 65%,
                var(--dark) 100%
            );

            box-shadow:
                0 8px 0 var(--shadow),
                0 12px 18px rgba(0, 0, 0, 0.14),
                inset 0 5px 0 rgba(255, 255, 255, 0.30),
                inset 0 -8px 0 rgba(0, 0, 0, 0.10);

            transition: transform 0.1s ease,
                        box-shadow 0.1s ease;
        }

        /* REFLET GLACÉ */

        .chapitre::before {
            content: "";

            position: absolute;
            top: 5px;
            left: 10%;

            width: 80%;
            height: 42%;

            background: linear-gradient(
                to bottom,
                rgba(255, 255, 255, 0.70) 0%,
                rgba(255, 255, 255, 0.25) 40%,
                rgba(255, 255, 255, 0) 100%
            );

            border-radius: 50%;

            pointer-events: none;
            z-index: 2;
        }

        /* PETIT REFLET */

        .chapitre::after {
            content: "";

            position: absolute;

            top: 16px;
            left: 25px;

            width: 28px;
            height: 13px;

            background: rgba(255, 255, 255, 0.30);

            border-radius: 50%;

            transform: rotate(-20deg);

            pointer-events: none;
            z-index: 3;
        }

        /* ICÔNES */

        .chapitre svg {
            width: 62px;
            height: 62px;

            position: relative;
            z-index: 4;

            filter: drop-shadow(
                0 3px 0 rgba(0, 0, 0, 0.15)
            );
        }

        /* NOM DU CHAPITRE */

        .chapitre-name {
            margin-top: 12px;
            font-size: 17px;
            font-weight: 900;
            color: #17345f;
            text-align: center;
        }
        
        /* CLIC */

        .chapitre:active {
            transform: translateY(7px);

            box-shadow:
                0 2px 0 var(--shadow),
                0 5px 10px rgba(0, 0, 0, 0.12),
                inset 0 4px 0 rgba(255, 255, 255, 0.25),
                inset 0 -5px 0 rgba(0, 0, 0, 0.10);
        }

        /* COULEURS */

        .fractions {

        /* NAVIGATION */

        nav {

            bottom: 0;
            left: 50%;
            transform: translateX(-50%);

            max-width: 500px;
            height: 70px;

            }

            .chapitre-name {

            }
        }
