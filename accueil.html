<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EPPIA - Accueil</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Nunito', sans-serif; }

        body {
            background: #f5f5f5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            max-width: 500px;
            margin: 0 auto;
            padding-bottom: 80px;
        }

        /* HEADER COMPACT */
        .header {
            background: #111;
            padding: 44px 16px 14px;
            border-radius: 0 0 20px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-left { display: flex; flex-direction: column; gap: 1px; }
        .greeting { font-size: 11px; font-weight: 700; color: rgba(255,255,255,0.65); }
        .username { font-size: 18px; font-weight: 900; color: #fff; }

        .header-right {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 5px;
        }

        .streak {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 20px;
            padding: 3px 10px;
            font-size: 11px;
            font-weight: 800;
            color: #fff;
        }

          .last-course{
    background:#fff;
    margin:20px 16px;
    padding:18px;
    border-radius:22px;
    display:flex;
    align-items:center;
    gap:15px;
    box-shadow:0 8px 20px rgba(0,0,0,.08);
}

.course-icon{
    width:55px;
    height:55px;
    border-radius:50%;
    background:#f3f3ff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:26px;
}

.course-content{
    flex:1;
}

.course-title{
    font-size:12px;
    color:#888;
    font-weight:700;
}

.course-name{
    font-size:18px;
    font-weight:900;
    color:#222;
    margin:4px 0;
}

.course-subtitle{
    font-size:12px;
    color:#777;
}

.continue-btn{
    background:#0000cc;
    color:white;
    border:none;
    border-radius:12px;
    padding:10px 16px;
    font-weight:800;
    cursor:pointer;
}

        .progress-circle{
    width:40px;
    height:40px;
    position:relative;
}

.progress-circle svg{
    width:40px;
    height:40px;
    transform:rotate(-90deg);
}

.progress-circle circle{
    fill:none;
    stroke-width:3;
}

.circle-bg{
    stroke:rgba(255,255,255,.25);
}

.circle-fill{
    stroke:#fff;
    stroke-linecap:round;
    stroke-dasharray:88;
    stroke-dashoffset:48; /* 45% */
}

.progress-pct{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    font-size:9px;
    font-weight:900;
    color:#fff;
}

  


        /* SECTION TITRE */
        .section-title {
            padding: 20px 16px 10px;
            font-size: 15px;
            font-weight: 800;
            color: #222;
        }

        /* BULLES */
        .bubbles {
            padding: 0 16px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top:8px;
        }

        .bubble {
            border-radius: 50px;
            padding: 10px 18px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            border: 1.5px solid transparent;
            width: 65%;
            transition: transform 0.15s, box-shadow 0.15s;
        }

        .bubble:nth-child(1) { align-self: flex-start; }
        .bubble:nth-child(2) { align-self: center; }
        .bubble:nth-child(3) { align-self: flex-end; }
        .bubble:nth-child(4) { align-self: flex-start; }
        .bubble:nth-child(5) { align-self: center; }
        .bubble:nth-child(6) { align-self: flex-end; }

        .bubble:hover {
            box-shadow: 0 6px 20px rgba(0,0,0,0.1);
            transform: translateY(-2px);
        }

        .bubble:active { transform: scale(0.97); }

        .bubble-maths { background: #fff; border-color: #e0e0e0; }
        .bubble-svt { background: #fff; border-color: #e0e0e0; }
        .bubble-francais { background: #fff; border-color: #e0e0e0; }
        .bubble-physique { background: #fff; border-color: #e0e0e0; }
        .bubble-histoire { background: #fff; border-color: #e0e0e0; }
        .bubble-anglais { background: #fff; border-color: #e0e0e0; }

        /* PLACEHOLDER IMAGE */
        .bubble-img {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #e0e0e0;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            color: #999;
            font-weight: 700;
        }

        .bubble-name {
            font-size: 13px;
            font-weight: 800;
            color: #222;
            flex: 1;
        }

        /* NAV BAS */
        .nav {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 500px;
            background: #fff;
            border-top: 1px solid #eee;
            display: flex;
            justify-content: space-around;
            padding: 10px 0 16px;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            padding: 6px 10px;
            border-radius: 12px;
            cursor: pointer;
            text-decoration: none;
        }

        .nav-item.active { background: #f0f0ff; }

        /* ICÔNES LIGNES FINES SVG */
        .nav-icon svg {
            width: 22px;
            height: 22px;
            stroke: #bbb;
            fill: none;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .nav-item.active svg { stroke: #0000cc; }

        .nav-label {
            font-size: 9px;
            font-weight: 700;
            color: #bbb;
        }

        .nav-item.active .nav-label { color: #0000cc; }
    </style>
</head>
<body>

    <!-- HEADER -->
    <div class="header">
        <div class="header-left">
            <div class="greeting">Bonsoir</div>
            <div class="username">Maya</div>
    
        <div class="header-right">
            <div class="streak">7 jours</div>
            <div class="progress-circle">
               <svg viewBox="0 0 36 36" width="36" height="36">
                 <circle class="circle-bg" cx="18" cy="18" r="14"></circle>
                 <circle class="circle-fill" cx="18" cy="18" r="14"></circle>
                </svg>

              <div class="progress-pct">45%</div>
            </div>
        </div>
    </div>
    <div class="last-course">
  </div>
    <div class="course-icon">📖</div>

    <div class="course-content">
        <div class="course-title">Dernier chapitre</div>
        <div class="course-name">Les fractions</div>
        <div class="course-subtitle">Mathématiques • 45 % terminé</div>
    </div>

    <button class="continue-btn">Continuer</button>

</div>

    <!-- MATIÈRES -->
    <div class="section-title">Tes matières</div>

    <div class="bubbles">

        <div class="bubble bubble-maths" onclick="window.location.href='cours.html'">
            <div class="bubble-img">IMG</div>
            <div class="bubble-name">Mathématiques</div>
        </div>

        <div class="bubble bubble-svt" onclick="window.location.href='cours.html'">
            <div class="bubble-img">IMG</div>
            <div class="bubble-name">SVT</div>
        </div>

        <div class="bubble bubble-physique" onclick="window.location.href='cours.html'">
            <div class="bubble-img">IMG</div>
            <div class="bubble-name">Physique-Chimie</div>
        </div>

        <div class="bubble bubble-anglais" onclick="window.location.href='cours.html'">
            <div class="bubble-img">IMG</div>
            <div class="bubble-name">Anglais</div>
        </div>

        <div class="bubble bubble-francais" onclick="window.location.href='cours.html'">
            <div class="bubble-img">IMG</div>
            <div class="bubble-name">Français</div>
        </div>

        <div class="bubble bubble-histoire" onclick="window.location.href='cours.html'">
            <div class="bubble-img">IMG</div>
            <div class="bubble-name">Histoire-Géo</div>
        </div>

    </div>

    <!-- NAV BAS -->
    <div class="nav">

        <a class="nav-item active" href="accueil.html">
            <div class="nav-icon">
                <svg viewBox="0 0 24 24">
                    <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
                    <polyline points="9 22 9 12 15 12 15 22"/>
                </svg>
            </div>
            <div class="nav-label">Accueil</div>
        </a>

        <a class="nav-item" href="actualites.html">
            <div class="nav-icon">
                <svg viewBox="0 0 24 24">
                    <path d="M4 22h16a2 2 0 002-2V4a2 2 0 00-2-2H8a2 2 0 00-2 2v16a2 2 0 01-2 2zm0 0a2 2 0 01-2-2v-9c0-1.1.9-2 2-2h2"/>
                    <path d="M18 14h-8M15 18h-5M10 6h8v4h-8z"/>
                </svg>
            </div>
            <div class="nav-label">Actualité</div>
        </a>

        <a class="nav-item" href="progression.html">
            <div class="nav-icon">
                <svg viewBox="0 0 24 24">
                    <line x1="18" y1="20" x2="18" y2="10"/>
                    <line x1="12" y1="20" x2="12" y2="4"/>
                    <line x1="6" y1="20" x2="6" y2="14"/>
                </svg>
            </div>
            <div class="nav-label">Progrès</div>
        </a>

        <a class="nav-item" href="livres.html">
            <div class="nav-icon">
                <svg viewBox="0 0 24 24">
                    <path d="M4 19.5A2.5 2.5 0 016.5 17H20"/>
                    <path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/>
                </svg>
            </div>
            <div class="nav-label">Livres</div>
        </a>

        <a class="nav-item" href="profil.html">
            <div class="nav-icon">
                <svg viewBox="0 0 24 24">
                    <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
                    <circle cx="12" cy="7" r="4"/>
                </svg>
            </div>
            <div class="nav-label">Profil</div>
        </a>

    </div>

</body>
</html>
