<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EPPIA - Duel</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root { --main: #f39f39; --shadow: #bd6c16; --on-main: #fff; }

    body {
        font-family: 'Nunito', sans-serif; background: #f5f5f5; color: #333;
        max-width: 500px; margin: 0 auto; min-height: 100vh; padding: 10px 14px 24px;
    }

    /* ===== HAUT ===== */
    .top { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    .quit {
        width: 38px; height: 38px; border-radius: 12px; background: #fff;
        border: 2px solid rgba(0,0,0,0.08); border-bottom-width: 4px;
        display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .quit svg { width: 18px; height: 18px; stroke: #777; stroke-width: 3; fill: none; stroke-linecap: round; }
    .top-titre { flex: 1; text-align: center; font-weight: 900; font-size: 16px; }
    .chrono { min-width: 54px; text-align: right; font-size: 15px; font-weight: 900; color: #444; font-variant-numeric: tabular-nums; }
    .chrono.urgent { color: #e04646; }
    #demoTag { text-align: center; font-size: 11px; font-weight: 800; color: #999; margin: -2px 0 6px; }

    /* ===== ARENE VERTICALE ===== */
    .arena {
        position: relative; border-radius: 22px; overflow: hidden; padding: 8px 10px;
        border: 3px solid rgba(0,0,0,0.1); border-bottom-width: 7px;
        background: #fbfbfd;
    }
    .cartes-rival, .cartes-joueur { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    .carte-r {
        height: 34px; border-radius: 10px; background: #ef4a3a; border-bottom: 4px solid #b92f22;
        display: flex; align-items: center; justify-content: center; color: rgba(255,255,255,0.7); font-weight: 900; font-size: 14px;
        transition: transform 0.25s, background 0.25s;
    }
    .carte-r.joue { transform: translateY(14px) scale(1.12); background: #ffb300; border-bottom-color: #c98a00; color: #fff; }

    .camp { display: flex; flex-direction: column; align-items: center; }
    .camp-nom { font-size: 12px; font-weight: 900; display: flex; gap: 6px; align-items: center; margin-bottom: 3px; }
    .chip-bot { font-size: 9px; letter-spacing: .04em; text-transform: uppercase; background: #eef1f6; color: #667; padding: 1px 6px; border-radius: 8px; }
    .hp-track { width: 170px; height: 15px; background: #e3e3e3; border-radius: 9px; overflow: hidden; position: relative; }
    .hp-fill { height: 100%; width: 100%; background: #58b520; box-shadow: inset 0 -3px 0 rgba(0,0,0,0.13); transition: width 0.6s, background 0.3s; }
    .hp-fill.moyen { background: #f5a623; } .hp-fill.bas { background: #e04646; }
    .hp-nb { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 900; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,0.7); }

    .trone { position: relative; width: 86px; height: 98px; margin: 6px 0; }
    .trone svg.siege { width: 100%; height: 100%; display: block; }
    .perso {
        position: absolute; left: 50%; top: 14px; margin-left: -23px; width: 46px; height: 46px; border-radius: 50%;
        background: var(--c, #ccc); border: 3px solid #fff; border-bottom-width: 5px;
        display: flex; align-items: center; justify-content: center; overflow: hidden; z-index: 2;
    }
    .perso img { width: 100%; height: 100%; object-fit: cover; }
    .perso svg { width: 26px; height: 26px; fill: #fff; }
    .trone.touche { animation: secoue 0.45s; }
    .trone.touche .perso { filter: brightness(1.3) saturate(1.4); }
    @keyframes secoue { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }

    .riviere {
        position: relative; height: 32px; margin: 2px -10px; background: linear-gradient(#2a5cb0, #1f4a96);
        display: flex; align-items: center; justify-content: center;
    }
    .riviere::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(100deg, transparent 0 22px, rgba(255,255,255,0.1) 22px 26px); }
    #banniere { position: relative; z-index: 2; color: #fff; font-weight: 900; font-size: 13px; letter-spacing: .03em; opacity: 0; transition: opacity 0.2s; text-align: center; padding: 0 8px; }
    #banniere.visible { opacity: 1; }

    .proj {
        position: absolute; z-index: 6; left: 0; top: 0; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%;
        display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 19px; color: #fff;
        background: radial-gradient(circle at 35% 30%, #ffe27a, var(--pc, #ff8a00) 70%);
        box-shadow: 0 0 18px var(--pc, #ff8a00), 0 0 0 3px rgba(255,255,255,0.85); text-shadow: 0 2px 0 rgba(0,0,0,0.35);
    }
    .degats {
        position: absolute; z-index: 7; font-weight: 900; font-size: 26px; color: #fff;
        text-shadow: 0 2px 0 #c0392b, 0 0 8px #c0392b; animation: monte 1.1s ease-out forwards; pointer-events: none;
    }
    @keyframes monte { 0% { opacity: 0; transform: translateY(8px); } 20% { opacity: 1; } 100% { opacity: 0; transform: translateY(-30px); } }

    /* ===== POINTS (énergie) + CARTES JOUEUR ===== */
    .energie { display: flex; align-items: center; gap: 8px; margin: 4px 0 8px; }
    .energie-pastilles { flex: 1; display: grid; grid-template-columns: repeat(10, 1fr); gap: 3px; }
    .energie-pastilles i { height: 12px; border-radius: 4px; background: #e3e3e3; transition: background 0.2s; }
    .energie-pastilles i.on { background: #c14ddb; box-shadow: inset 0 -3px 0 rgba(0,0,0,0.15); }
    .energie-nb { font-weight: 900; font-size: 14px; color: #a031bb; min-width: 44px; text-align: right; }
    .carte-j {
        position: relative; border: none; border-radius: 14px; padding: 8px 2px 6px; cursor: pointer;
        font-family: inherit; color: #fff; background: #1f2a44; border-bottom: 5px solid #0c1428;
        display: flex; flex-direction: column; align-items: center; gap: 1px;
    }
    .carte-j .cout { font-size: 22px; font-weight: 900; line-height: 1; }
    .carte-j .nom { font-size: 10px; font-weight: 800; opacity: 0.9; }
    .carte-j .eff { font-size: 9px; font-weight: 700; opacity: 0.7; }
    .carte-j:active:not(:disabled) { transform: translateY(3px); border-bottom-width: 2px; }
    .carte-j:disabled { background: #d9d9d9; border-bottom-color: #bdbdbd; color: #888; cursor: not-allowed; }
    .carte-j.piege:not(:disabled) { background: #7a2fb0; border-bottom-color: #4d1a74; }
    .carte-j:focus-visible { outline: 4px solid #0000cc; outline-offset: 2px; }

    /* ===== QUESTION ===== */
    .panneau { margin-top: 12px; }
    .panneau.piege .question { border-color: #a031bb; background: #f8ecfd; }
    .etiquette { font-size: 11px; font-weight: 900; color: #a031bb; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 4px; min-height: 14px; }
    .minuteur { height: 8px; background: #e5e5e5; border-radius: 6px; overflow: hidden; margin-bottom: 8px; }
    #minuteurFill { height: 100%; width: 100%; background: var(--main); border-radius: 6px; transition: width 0.1s linear; }
    #minuteurFill.urgent { background: #e04646; }
    .question {
        background: #fff; border-radius: 18px; border: 2px solid rgba(0,0,0,0.08); border-bottom-width: 5px;
        padding: 12px 14px; font-size: 17px; font-weight: 800; line-height: 1.3; margin-bottom: 10px;
    }
    .reponses { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .reponse {
        display: flex; align-items: center; gap: 8px; min-height: 52px; padding: 6px 10px;
        background: #fff; color: #333; border: 2px solid #e2e2e2; border-bottom-width: 5px; border-radius: 14px;
        font-family: inherit; font-size: 16px; font-weight: 800; text-align: left; cursor: pointer;
    }
    .reponse:active:not(:disabled) { transform: translateY(3px); border-bottom-width: 2px; }
    .reponse:focus-visible { outline: 4px solid #0000cc; outline-offset: 2px; }
    .reponse:disabled { cursor: default; }
    .badge { width: 26px; height: 26px; border-radius: 8px; border: 2px solid #d5d5d5; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 900; color: #888; flex-shrink: 0; }
    .badge svg { width: 15px; height: 15px; fill: none; stroke: #fff; stroke-width: 3.4; stroke-linecap: round; stroke-linejoin: round; }
    .reponse.juste { border-color: #7bd23a; background: #e5f8d2; color: #2d6a0f; }
    .reponse.juste .badge { background: #7bd23a; border-color: #7bd23a; }
    .reponse.faux { border-color: #f06b6b; background: #ffe3e3; color: #a12626; }
    .reponse.faux .badge { background: #f06b6b; border-color: #f06b6b; }
    #retour { min-height: 38px; margin-top: 8px; font-size: 13px; font-weight: 700; color: #555; line-height: 1.35; }
    #retour b { color: #a12626; }

    /* ===== FIN ===== */
    #fin { display: none; text-align: center; padding-top: 26px; }
    #fin.visible { display: block; }
    .fin-icone { width: 110px; height: 110px; margin: 0 auto 18px; border-radius: 50%; background: var(--main); border-bottom: 6px solid var(--shadow); display: flex; align-items: center; justify-content: center; }
    .fin-icone svg { width: 54px; height: 54px; fill: none; stroke: var(--on-main); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    #finTitre { font-size: 28px; font-weight: 900; margin-bottom: 6px; }
    #finTexte { font-size: 15px; font-weight: 700; color: #666; margin-bottom: 22px; line-height: 1.4; }
    .fin-score { display: inline-flex; gap: 10px; margin-bottom: 26px; }
    .stat { background: #fff; border-radius: 16px; border: 2px solid rgba(0,0,0,0.08); border-bottom-width: 5px; padding: 12px 18px; min-width: 120px; }
    .stat b { display: block; font-size: 24px; font-weight: 900; }
    .stat span { font-size: 11px; font-weight: 800; color: #888; text-transform: uppercase; letter-spacing: 0.05em; }
    .fin-actions { display: flex; flex-direction: column; gap: 12px; }
    .btn-principal { width: 100%; padding: 15px; border: none; border-radius: 16px; border-bottom: 5px solid var(--shadow); background: var(--main); color: var(--on-main); font-family: inherit; font-size: 17px; font-weight: 900; letter-spacing: 0.05em; text-transform: uppercase; cursor: pointer; }
    .btn-principal:active { transform: translateY(3px); border-bottom-width: 2px; }
    .btn-secondaire { display: block; width: 100%; padding: 15px; border-radius: 16px; border: 2px solid #e2e2e2; border-bottom-width: 5px; background: #fff; color: #555; font-size: 16px; font-weight: 900; letter-spacing: 0.05em; text-transform: uppercase; text-decoration: none; text-align: center; }

    @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>

    <div class="top">
        <a class="quit" id="btnQuitter" href="jeux.html" aria-label="Quitter le duel"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></a>
        <div class="top-titre">Duel</div>
        <div class="chrono" id="chrono">2:00</div>
    </div>
    <div id="demoTag" hidden>Questions de démonstration</div>

    <main id="zoneJeu">
        <div class="arena" id="arena">
            <!-- cartes cachées du rival -->
            <div class="cartes-rival" id="cartesRival" aria-hidden="true"><div class="carte-r">?</div><div class="carte-r">?</div><div class="carte-r">?</div><div class="carte-r">?</div></div>

            <div class="camp" id="campRival">
                <div class="camp-nom"><span id="nomRival">Rival</span><span class="chip-bot">Entraînement</span></div>
                <div class="hp-track"><div class="hp-fill" id="hpRival"></div><div class="hp-nb" id="hpRivalNb"></div></div>
                <div class="trone" id="troneRival"><svg class="siege" viewBox="0 0 104 118" aria-hidden="true"><rect x="14" y="14" width="76" height="76" rx="26" fill="#ef5350" stroke="#b73431" stroke-width="4"/><rect x="2" y="70" width="22" height="34" rx="9" fill="#b73431"/><rect x="80" y="70" width="22" height="34" rx="9" fill="#b73431"/><rect x="10" y="84" width="84" height="20" rx="9" fill="#ef5350" stroke="#b73431" stroke-width="4"/><rect x="20" y="104" width="12" height="12" rx="3" fill="#b73431"/><rect x="72" y="104" width="12" height="12" rx="3" fill="#b73431"/><path d="M34 16l6-12 6 9 6-12 6 12 6-9 6 12z" fill="#ffc21a" stroke="#c98a00" stroke-width="2.5" stroke-linejoin="round"/></svg><div class="perso" id="persoRival"></div></div>
            </div>

            <div class="riviere" aria-live="polite"><div id="banniere"></div></div>

            <div class="camp" id="campJoueur">
                <div class="trone" id="troneJoueur"><svg class="siege" viewBox="0 0 104 118" aria-hidden="true"><rect x="14" y="14" width="76" height="76" rx="26" fill="#4f8ff0" stroke="#2f66bd" stroke-width="4"/><rect x="2" y="70" width="22" height="34" rx="9" fill="#2f66bd"/><rect x="80" y="70" width="22" height="34" rx="9" fill="#2f66bd"/><rect x="10" y="84" width="84" height="20" rx="9" fill="#4f8ff0" stroke="#2f66bd" stroke-width="4"/><rect x="20" y="104" width="12" height="12" rx="3" fill="#2f66bd"/><rect x="72" y="104" width="12" height="12" rx="3" fill="#2f66bd"/><path d="M34 16l6-12 6 9 6-12 6 12 6-9 6 12z" fill="#ffc21a" stroke="#c98a00" stroke-width="2.5" stroke-linejoin="round"/></svg><div class="perso" id="persoJoueur"></div></div>
                <div class="hp-track"><div class="hp-fill" id="hpJoueur"></div><div class="hp-nb" id="hpJoueurNb"></div></div>
                <div class="camp-nom" style="margin: 3px 0 0">Toi</div>
            </div>

            <div class="energie">
                <div class="energie-pastilles" id="pastilles"></div>
                <div class="energie-nb" id="energieNb">0/10</div>
            </div>
            <div class="cartes-joueur" id="cartesJoueur"></div>
        </div>

        <section class="panneau" id="panneau">
            <div class="etiquette" id="etiquette"></div>
            <div class="minuteur" aria-hidden="true"><div id="minuteurFill"></div></div>
            <div class="question" id="questionTexte"></div>
            <div class="reponses" id="reponses"></div>
            <div id="retour" role="status" aria-live="polite"></div>
        </section>
    </main>

    <section id="fin" aria-live="polite">
        <div class="fin-icone" id="finIcone"></div>
        <h1 id="finTitre"></h1>
        <p id="finTexte"></p>
        <div class="fin-score">
            <div class="stat"><b id="finBonnes">0/0</b><span>Bonnes réponses</span></div>
            <div class="stat"><b id="finPv">0</b><span>PV restants</span></div>
        </div>
        <div class="fin-actions">
            <button class="btn-principal" id="btnRejouer">Revanche</button>
            <a class="btn-secondaire" id="btnRetour" href="jeux.html">Retour aux jeux</a>
        </div>
    </section>

    <!-- Quand ta banque de questions sera prête : retire les symboles de commentaire autour de la ligne suivante. -->
    <!-- <script src="banque.js"></script> -->

    <script>
        /* ============================================================
           1. RÉGLAGES (tu peux tout modifier ici)
           ============================================================ */
        const PV_DEPART     = 100;   // points de vie de chaque joueur
        const DUREE_MATCH   = 120;   // durée du duel en secondes
        const TEMPS_QUESTION = 15;   // secondes pour répondre à une question
        const TEMPS_PIEGE    = 8;    // secondes pour répondre à une question piège
        const ENERGIE_MAX   = 10;
        const GAIN_BASE     = 3;     // points gagnés pour une bonne réponse
        const GAIN_VITESSE  = 2;     // points en plus si on répond très vite
        const DEGATS_PIEGE_RATE = 20; // dégâts si la question piège est ratée

        // Les 4 cartes de puissance (coût = points à dépenser)
        const CARTES = [
            { id: "eclair", cout: 3,  nom: "Éclair",   effet: "-6",  degats: 6 },
            { id: "boule",  cout: 5,  nom: "Boule",    effet: "-12", degats: 12 },
            { id: "piege",  cout: 8,  nom: "Piège",    effet: "Question dure", piege: true },
            { id: "mega",   cout: 10, nom: "Méga",     effet: "-25", degats: 25 }
        ];

        // Le rival simulé : précision et vitesse selon le niveau
        const RIVAL_PAR_NIVEAU = {
            debute: { precision: 0.50, tMin: 5, tMax: 11 },
            bases:  { precision: 0.62, tMin: 4, tMax: 10 },
            bloque: { precision: 0.45, tMin: 6, tMax: 12 }
        };
        const RIVAUX = [
            { nom: "Lapin Express", couleur: "#64a9fd" },
            { nom: "Panda Malin",   couleur: "#8fd14f" },
            { nom: "Chat Futé",     couleur: "#b890ff" },
            { nom: "Mouton Zen",    couleur: "#ed98cf" }
        ];

        /* ============================================================
           2. COULEURS DU CHAPITRE
           ============================================================ */
        const palette = [
            { main: "#f39f39", shadow: "#bd6c16" }, { main: "#fff1a7", shadow: "#c5b544" },
            { main: "#b890ff", shadow: "#7953c7" }, { main: "#ed98cf", shadow: "#b75b98" },
            { main: "#64a9fd", shadow: "#3470b8" }, { main: "#b8447e", shadow: "#702348" },
            { main: "#ef5350", shadow: "#8f241f" }, { main: "#7a63f5", shadow: "#3e3091" },
            { main: "#8fd14f", shadow: "#3f7a1e" }
        ];
        function hashSlug(str) { let h = 0; for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) >>> 0; return h; }
        function couleurTexteSur(hex) {
            const n = parseInt(hex.slice(1), 16);
            const l = (0.299 * ((n >> 16) & 255) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255)) / 255;
            return l > 0.62 ? "#2b2b2b" : "#ffffff";
        }
        const params = new URLSearchParams(window.location.search);
        const slug = params.get("chapitre") || "fractions";
        const niveau = params.get("niveau") || "debute";
        (function () {
            const d = palette[hashSlug(slug) % palette.length], r = document.documentElement.style;
            r.setProperty("--main", d.main); r.setProperty("--shadow", d.shadow); r.setProperty("--on-main", couleurTexteSur(d.main));
            const retour = "jeux.html?chapitre=" + encodeURIComponent(slug);
            document.getElementById("btnQuitter").href = retour; document.getElementById("btnRetour").href = retour;
        })();

        /* ============================================================
           3. LES QUESTIONS (démo, puis banque Supabase)
           ============================================================ */
        const QUESTIONS_DEMO = [
            { question: "Quelle fraction représente la moitié ?", choix: ["1/2", "2/1", "1/4", "2/3"], bonne_reponse: "1/2", explication: "La moitié, c'est 1 part sur 2 parts égales : 1/2." },
            { question: "Combien font 1/4 + 2/4 ?", choix: ["3/4", "3/8", "2/8", "1/2"], bonne_reponse: "3/4", explication: "Même dénominateur : 1 + 2 = 3, donc 3/4." },
            { question: "Quelle fraction est égale à 2/4 ?", choix: ["1/2", "1/4", "4/2", "3/4"], bonne_reponse: "1/2", explication: "On divise le haut et le bas par 2 : 1/2." },
            { question: "Que vaut 3/5 de 20 ?", choix: ["12", "15", "4", "8"], bonne_reponse: "12", explication: "1/5 de 20 = 4, puis 4 × 3 = 12." },
            { question: "Quelle fraction est la plus grande ?", choix: ["1/2", "1/3", "1/4", "1/5"], bonne_reponse: "1/2", explication: "Même numérateur : plus le dénominateur est grand, plus la part est petite." },
            { question: "Combien font 1/2 + 1/3 ?", choix: ["5/6", "2/5", "1/5", "2/6"], bonne_reponse: "5/6", explication: "Dénominateur commun 6 : 3/6 + 2/6 = 5/6." },
            { question: "Simplifie la fraction 6/8.", choix: ["3/4", "2/3", "6/4", "3/8"], bonne_reponse: "3/4", explication: "On divise le haut et le bas par 2 : 3/4." },
            { question: "Combien font 2/3 × 3/4 ?", choix: ["1/2", "5/12", "6/7", "3/4"], bonne_reponse: "1/2", explication: "2 × 3 = 6 et 3 × 4 = 12, donc 6/12 = 1/2." }
        ];
        function melanger(t) { const a = t.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
        async function obtenirQuestions() {
            if (typeof chargerQuestions === "function") {
                try { const q = await chargerQuestions(slug, niveau, 40); if (q && q.length) return q; }
                catch (e) { console.warn("Banque indisponible, questions de démo utilisées.", e); }
            }
            document.getElementById("demoTag").hidden = false;
            return QUESTIONS_DEMO;
        }
        let reserve = [];
        function prochaineQuestion() {
            if (!reserve.length) reserve = melanger(toutesQuestions);
            const q = reserve.pop();
            return { ...q, choix: melanger(q.choix) };
        }

        /* ============================================================
           4. ÉTAT DU DUEL
           ============================================================ */
        const ICONE_OK  = '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
        const ICONE_NON = '<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>';
        const LETTRES = ["A", "B", "C", "D"];
        const el = id => document.getElementById(id);
        const echapper = t => { const d = document.createElement("div"); d.textContent = t; return d.innerHTML; };
        const pause = ms => new Promise(r => setTimeout(r, ms));

        const rivalProfil = RIVAL_PAR_NIVEAU[niveau] || RIVAL_PAR_NIVEAU.debute;
        const rival = RIVAUX[Math.floor(Math.random() * RIVAUX.length)];

        let toutesQuestions = [];
        let pvJoueur = PV_DEPART, pvRival = PV_DEPART;
        let energie = 0, energieRival = 0;
        let bonnes = 0, repondues = 0;
        let fini = false, tempsMatch = DUREE_MATCH;
        let qCourante = null, enPiege = false, peutRepondre = false, piegeEnAttente = false;
        let tempsQ = 0, dureeQ = TEMPS_QUESTION;
        let tMatch = null, tQ = null, tBot = null, tPause = null;

        /* ---- affichage ---- */
        function avatarHtml(url) {
            if (url) return '<img src="' + encodeURI(url) + '" alt="">';
            return '<svg viewBox="0 0 24 24"><circle cx="8" cy="8" r="2.4"/><circle cx="16" cy="8" r="2.4"/><circle cx="5" cy="14" r="2.2"/><circle cx="19" cy="14" r="2.2"/><path d="M12 12c-3 0-5 2.6-5 5 0 1.8 1.4 3 3 3 .8 0 1.3-.3 2-.3s1.2.3 2 .3c1.6 0 3-1.2 3-3 0-2.4-2-5-5-5z"/></svg>';
        }
        function classeHp(pv) { return pv > 50 ? "" : (pv > 25 ? "moyen" : "bas"); }
        function majHp() {
            el("hpJoueur").style.width = Math.max(pvJoueur, 0) + "%"; el("hpRival").style.width = Math.max(pvRival, 0) + "%";
            el("hpJoueur").className = "hp-fill " + classeHp(pvJoueur); el("hpRival").className = "hp-fill " + classeHp(pvRival);
            el("hpJoueurNb").textContent = Math.max(pvJoueur, 0); el("hpRivalNb").textContent = Math.max(pvRival, 0);
        }
        function majEnergie() {
            el("pastilles").querySelectorAll("i").forEach((p, i) => p.classList.toggle("on", i < energie));
            el("energieNb").textContent = energie + "/" + ENERGIE_MAX;
            el("cartesJoueur").querySelectorAll(".carte-j").forEach((b, i) => { b.disabled = fini || energie < CARTES[i].cout; });
        }
        function banniere(texte) {
            const b = el("banniere"); b.textContent = texte; b.classList.add("visible");
            clearTimeout(banniere.t); banniere.t = setTimeout(() => b.classList.remove("visible"), 2200);
        }
        function initInterface() {
            el("nomRival").textContent = rival.nom;
            el("persoRival").style.setProperty("--c", rival.couleur); el("persoRival").innerHTML = avatarHtml(null);
            let url = null; try { url = localStorage.getItem("eppia_avatar"); } catch (e) {}
            el("persoJoueur").style.setProperty("--c", "#4f8ff0"); el("persoJoueur").innerHTML = avatarHtml(url);
            el("pastilles").innerHTML = "<i></i>".repeat(ENERGIE_MAX);
            el("cartesJoueur").innerHTML = CARTES.map(c =>
                '<button class="carte-j' + (c.piege ? " piege" : "") + '" data-id="' + c.id + '" aria-label="' + c.nom + ', coût ' + c.cout + '">' +
                '<span class="cout">' + c.cout + '</span><span class="nom">' + c.nom + '</span><span class="eff">' + c.effet + '</span></button>').join("");
            el("cartesJoueur").querySelectorAll(".carte-j").forEach((b, i) => b.addEventListener("click", () => jouerCarte(CARTES[i])));
            majHp(); majEnergie(); majChrono();
        }
        function majChrono() {
            const m = Math.floor(tempsMatch / 60), s = Math.floor(tempsMatch % 60);
            el("chrono").textContent = m + ":" + String(s).padStart(2, "0");
            el("chrono").classList.toggle("urgent", tempsMatch <= 15);
        }

        /* ---- attaque animée (boule qui traverse la rivière) ---- */
        async function attaquer(attaquant, degats, libelle) {
            const de = attaquant === "joueur" ? "persoJoueur" : "persoRival";
            const vers = attaquant === "joueur" ? "troneRival" : "troneJoueur";
            const arene = el("arena").getBoundingClientRect();
            const a = el(de).getBoundingClientRect(), b = el(vers).getBoundingClientRect();
            const x0 = a.left + a.width / 2 - arene.left, y0 = a.top + a.height / 2 - arene.top;
            const x1 = b.left + b.width / 2 - arene.left, y1 = b.top + b.height / 2 - arene.top;
            const p = document.createElement("div");
            p.className = "proj"; p.textContent = libelle || degats;
            p.style.setProperty("--pc", attaquant === "joueur" ? "#4f8ff0" : "#ef5350");
            el("arena").appendChild(p);
            const anim = p.animate([
                { transform: "translate(" + x0 + "px," + y0 + "px) scale(0.6)" },
                { transform: "translate(" + ((x0 + x1) / 2 + (attaquant === "joueur" ? 30 : -30)) + "px," + ((y0 + y1) / 2) + "px) scale(1.2)" },
                { transform: "translate(" + x1 + "px," + y1 + "px) scale(1)" }
            ], { duration: 750, easing: "ease-in", fill: "forwards" });
            await anim.finished.catch(() => {});
            p.remove();
            if (fini) return;
            if (attaquant === "joueur") pvRival -= degats; else pvJoueur -= degats;
            majHp();
            const t = el(vers); t.classList.remove("touche"); void t.offsetWidth; t.classList.add("touche");
            const d = document.createElement("div");
            d.className = "degats"; d.textContent = "-" + degats; d.style.left = (x1 - 18) + "px"; d.style.top = (y1 - 40) + "px";
            el("arena").appendChild(d); setTimeout(() => d.remove(), 1200);
            if (pvJoueur <= 0 || pvRival <= 0) { await pause(700); terminer(); }
        }

        /* ---- les cartes du joueur ---- */
        function jouerCarte(c) {
            if (fini || energie < c.cout) return;
            energie -= c.cout; majEnergie();
            if (c.piege) {
                banniere("Piège envoyé à " + rival.nom + " !");
                tPause = null;
                setTimeout(() => {
                    if (fini) return;
                    if (Math.random() < rivalProfil.precision * 0.45) banniere(rival.nom + " a esquivé le piège");
                    else { banniere(rival.nom + " s'est fait piéger !"); attaquer("joueur", DEGATS_PIEGE_RATE, DEGATS_PIEGE_RATE); }
                }, 3500);
            } else {
                attaquer("joueur", c.degats);
            }
        }

        /* ---- le rival simulé : il "répond" à des questions et joue ses cartes ---- */
        function programmerRival() {
            clearTimeout(tBot);
            if (fini) return;
            const delai = rivalProfil.tMin + Math.random() * (rivalProfil.tMax - rivalProfil.tMin);
            tBot = setTimeout(() => {
                if (fini) return;
                if (Math.random() < rivalProfil.precision) energieRival = Math.min(ENERGIE_MAX, energieRival + GAIN_BASE + (Math.random() < 0.4 ? 1 : 0));
                const jouables = CARTES.filter(c => c.cout <= energieRival);
                // il joue quand il peut s'offrir une carte intéressante
                if (jouables.length && (energieRival >= 5 || Math.random() < 0.4)) {
                    const c = Math.random() < 0.6 ? jouables[jouables.length - 1] : jouables[Math.floor(Math.random() * jouables.length)];
                    energieRival -= c.cout;
                    const idx = CARTES.indexOf(c), cr = el("cartesRival").children[idx];
                    cr.classList.add("joue"); cr.textContent = c.cout; setTimeout(() => { cr.classList.remove("joue"); cr.textContent = "?"; }, 1500);
                    if (c.piege) recevoirPiege(); else attaquer("rival", c.degats);
                }
                programmerRival();
            }, delai * 1000);
        }
        function recevoirPiege() {
            banniere(rival.nom + " te tend un piège !");
            piegeEnAttente = true;
            if (peutRepondre) afficherQuestion();
        }

        /* ---- les questions du joueur (en continu) ---- */
        function afficherQuestion() {
            if (fini) return;
            clearTimeout(tPause); clearInterval(tQ);
            enPiege = piegeEnAttente; piegeEnAttente = false;
            qCourante = prochaineQuestion(); peutRepondre = true;
            dureeQ = enPiege ? TEMPS_PIEGE : TEMPS_QUESTION; tempsQ = dureeQ;
            el("panneau").classList.toggle("piege", enPiege);
            el("etiquette").textContent = enPiege ? "Question piège : réponds vite, sinon -" + DEGATS_PIEGE_RATE : "Réponds juste pour gagner des points";
            el("questionTexte").textContent = qCourante.question;
            el("reponses").innerHTML = qCourante.choix.map((c, i) =>
                '<button class="reponse" data-i="' + i + '"><span class="badge">' + LETTRES[i] + '</span><span>' + echapper(c) + '</span></button>').join("");
            el("reponses").querySelectorAll(".reponse").forEach(b => b.addEventListener("click", () => repondre(parseInt(b.dataset.i, 10))));
            el("retour").textContent = "";
            majMinuteurQ();
            tQ = setInterval(() => {
                tempsQ = Math.max(tempsQ - 0.1, 0); majMinuteurQ();
                if (tempsQ <= 0) { clearInterval(tQ); repondre(-1); }
            }, 100);
        }
        function majMinuteurQ() {
            const f = el("minuteurFill");
            f.style.width = (tempsQ / dureeQ * 100) + "%"; f.classList.toggle("urgent", tempsQ <= dureeQ / 3);
        }
        function repondre(i) {
            if (!peutRepondre || fini) return;
            peutRepondre = false; clearInterval(tQ);
            const q = qCourante, bonne = q.choix.indexOf(q.bonne_reponse), juste = i === bonne;
            repondues++;
            el("reponses").querySelectorAll(".reponse").forEach((b, k) => {
                b.disabled = true;
                const badge = b.querySelector(".badge");
                if (k === bonne) { b.classList.add("juste"); badge.innerHTML = ICONE_OK; }
                else if (k === i) { b.classList.add("faux"); badge.innerHTML = ICONE_NON; }
            });
            let delai;
            if (juste) {
                bonnes++;
                if (enPiege) { energie = Math.min(ENERGIE_MAX, energie + 2); el("retour").textContent = "Piège esquivé ! +2 points"; banniere("Piège esquivé"); }
                else {
                    const gain = GAIN_BASE + Math.round(GAIN_VITESSE * (tempsQ / dureeQ));
                    energie = Math.min(ENERGIE_MAX, energie + gain);
                    el("retour").textContent = "Bonne réponse ! +" + gain + " points";
                }
                delai = 900;
            } else {
                enregistrerErreur(q);
                el("retour").innerHTML = (i === -1 ? "<b>Temps écoulé.</b> " : "<b>Raté.</b> ") + "Bonne réponse : " + echapper(q.bonne_reponse) + ". " + echapper(q.explication || "");
                if (enPiege) attaquer("rival", DEGATS_PIEGE_RATE, DEGATS_PIEGE_RATE);
                delai = 2600;
            }
            majEnergie();
            tPause = setTimeout(afficherQuestion, delai);
        }

        /* ============================================================
           5. FIN DU DUEL
           ============================================================ */
        function terminer() {
            if (fini) return;
            fini = true;
            clearInterval(tMatch); clearInterval(tQ); clearTimeout(tBot); clearTimeout(tPause);
            majEnergie();
            el("zoneJeu").style.display = "none";
            const trophee = '<svg viewBox="0 0 24 24"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 01-10 0z"/><path d="M17 5h3v2a3 3 0 01-3 3M7 5H4v2a3 3 0 003 3"/></svg>';
            const main = '<svg viewBox="0 0 24 24"><path d="M7 11l3-3 3 2 4-4M3 15l4 4 3-1 3 1 4-4 4 0"/></svg>';
            const coeur = '<svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.3C.9 8.3 2.7 4.5 6.4 4.5c2 0 3.7 1.1 4.6 2.7.2.3.6.3.8 0 .9-1.6 2.6-2.7 4.6-2.7 3.7 0 5.5 3.8 4 7.2C19.5 16.4 12 21 12 21z"/></svg>';
            const j = Math.max(pvJoueur, 0), r = Math.max(pvRival, 0);
            let titre, texte, icone, resultat;
            if (j === r) { titre = "Égalité"; texte = "Match serré contre " + rival.nom + ". Une revanche pour les départager ?"; icone = main; resultat = "egalite"; }
            else if (j > r) { titre = "Victoire !"; texte = "Tu as battu " + rival.nom + ". Bien joué !"; icone = trophee; resultat = "victoire"; }
            else { titre = "Défaite"; texte = rival.nom + " gagne cette fois. Relis tes erreurs et prends ta revanche."; icone = coeur; resultat = "defaite"; }
            el("finIcone").innerHTML = icone; el("finTitre").textContent = titre; el("finTexte").textContent = texte;
            el("finBonnes").textContent = bonnes + "/" + repondues; el("finPv").textContent = j;
            el("fin").classList.add("visible");
            const l = lire("eppia_duels");
            l.push({ chapitre: slug, niveau, resultat, bonnes, questions: repondues, pv: j, date: new Date().toISOString() });
            ecrire("eppia_duels", l.slice(-200));
        }
        function lire(cle) { try { return JSON.parse(localStorage.getItem(cle)) || []; } catch (e) { return []; } }
        function ecrire(cle, v) { try { localStorage.setItem(cle, JSON.stringify(v)); } catch (e) {} }
        function enregistrerErreur(q) {
            const l = lire("eppia_erreurs");
            l.push({ chapitre: slug, niveau, question: q.question, bonne_reponse: q.bonne_reponse, explication: q.explication || "", date: new Date().toISOString() });
            ecrire("eppia_erreurs", l.slice(-200));
        }

        /* ============================================================
           6. DÉMARRAGE
           ============================================================ */
        el("btnRejouer").addEventListener("click", () => window.location.reload());
        (async function demarrer() {
            initInterface();
            toutesQuestions = await obtenirQuestions();
            if (!toutesQuestions.length) { el("questionTexte").textContent = "Aucune question disponible pour le moment."; return; }
            afficherQuestion();
            programmerRival();
            tMatch = setInterval(() => { tempsMatch -= 1; majChrono(); if (tempsMatch <= 0) terminer(); }, 1000);
        })();
    </script>

</body>
