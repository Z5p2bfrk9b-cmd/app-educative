<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EPPIA - Exercice</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Nunito', sans-serif; }

        body {
            background: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            max-width: 500px;
            margin: 0 auto;
        }

        /* BARRE DU HAUT */
        .top-bar {
            padding: 16px 16px 8px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .close-btn {
            font-size: 22px;
            color: #ccc;
            text-decoration: none;
            font-weight: 700;
        }

        .progress-bar {
            flex: 1;
            height: 10px;
            background: #eee;
            border-radius: 6px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: #6B9FE4;
            border-radius: 6px;
            transition: width 0.4s;
        }

        .credits {
            display: flex;
            align-items: center;
            gap: 4px;
            background: #fff5e0;
            border: 2px solid #ffd080;
            border-radius: 20px;
            padding: 4px 10px;
            font-size: 12px;
            font-weight: 800;
            color: #e8a000;
        }

        /* NIVEAU */
        .niveau-badge {
            margin: 8px 16px 0;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #eef4ff;
            border-radius: 20px;
            padding: 4px 12px;
            font-size: 11px;
            font-weight: 800;
            color: #6B9FE4;
        }

        /* TYPE */
        .exercice-type {
            padding: 12px 16px 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .type-icon {
            width: 28px;
            height: 28px;
            background: #eef4ff;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

        .type-label {
            font-size: 12px;
            font-weight: 800;
            color: #6B9FE4;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        /* COQ + QUESTION */
        .question-section {
            padding: 8px 16px 24px;
            display: flex;
            align-items: flex-start;
            gap: 14px;
        }

        .coq {
            font-size: 52px;
            flex-shrink: 0;
        }

        .question-bubble {
            background: #f5f5f5;
            border-radius: 16px;
            border: 2px solid #e8e8e8;
            padding: 14px 16px;
            flex: 1;
            position: relative;
        }

        .question-bubble::before {
            content: '';
            position: absolute;
            left: -10px;
            top: 16px;
            border: 6px solid transparent;
            border-right-color: #e8e8e8;
        }

        .question-bubble::after {
            content: '';
            position: absolute;
            left: -7px;
            top: 18px;
            border: 4px solid transparent;
            border-right-color: #f5f5f5;
        }

        .question-text {
            font-size: 16px;
            font-weight: 800;
            color: #222;
            line-height: 1.4;
        }

        /* RÉPONSES */
        .reponses {
            padding: 0 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex: 1;
        }

        .reponse-btn {
            width: 100%;
            padding: 16px 20px;
            border-radius: 16px;
            border: 2px solid #e0e0e0;
            background: #fff;
            font-size: 15px;
            font-weight: 700;
            color: #333;
            cursor: pointer;
            text-align: left;
            transition: all 0.15s;
            font-family: 'Nunito', sans-serif;
        }

        .reponse-btn:hover { border-color: #6B9FE4; background: #eef4ff; }
        .reponse-btn.correct { border-color: #00c97a; background: #e8faf2; color: #00a060; }
        .reponse-btn.incorrect { border-color: #ff4757; background: #fff0f0; color: #cc0000; }
        .reponse-btn:disabled { cursor: not-allowed; }

        /* FEEDBACK */
        .feedback {
            display: none;
            padding: 14px 16px;
            margin: 12px 16px 0;
            border-radius: 16px;
            font-size: 14px;
            font-weight: 800;
            line-height: 1.4;
        }

        .feedback.correct { display: block; background: #e8faf2; color: #00a060; border: 2px solid #00c97a; }
        .feedback.incorrect { display: block; background: #fff0f0; color: #cc0000; border: 2px solid #ff4757; }

        /* RÉSULTAT FINAL */
        .resultat {
            display: none;
            flex-direction: column;
            align-items: center;
            padding: 40px 16px;
            text-align: center;
        }

        .resultat.show { display: flex; }

        .resultat-coq { font-size: 80px; margin-bottom: 16px; }

        .resultat-titre {
            font-size: 24px;
            font-weight: 900;
            color: #222;
            margin-bottom: 8px;
        }

        .resultat-score {
            font-size: 16px;
            font-weight: 700;
            color: #888;
            margin-bottom: 24px;
        }

        .resultat-niveau {
            background: #eef4ff;
            border-radius: 16px;
            padding: 14px 20px;
            margin-bottom: 24px;
            font-size: 14px;
            font-weight: 700;
            color: #6B9FE4;
        }

        .btn-recommencer {
            width: 100%;
            padding: 16px;
            border-radius: 16px;
            border: none;
            background: #6B9FE4;
            color: #fff;
            font-size: 15px;
            font-weight: 900;
            cursor: pointer;
            font-family: 'Nunito', sans-serif;
            margin-bottom: 12px;
        }

        .btn-retour {
            width: 100%;
            padding: 16px;
            border-radius: 16px;
            border: 2px solid #e0e0e0;
            background: #fff;
            color: #888;
            font-size: 15px;
            font-weight: 900;
            cursor: pointer;
            font-family: 'Nunito', sans-serif;
            text-decoration: none;
            display: block;
            text-align: center;
        }

        /* BOUTON CONTINUER */
        .bottom-bar {
            padding: 16px;
            margin-top: auto;
        }

        .continuer-btn {
            width: 100%;
            padding: 16px;
            border-radius: 16px;
            border: none;
            background: #e0e0e0;
            color: #aaa;
            font-size: 15px;
            font-weight: 900;
            cursor: not-allowed;
            font-family: 'Nunito', sans-serif;
            transition: all 0.15s;
        }

        .continuer-btn.active { background: #6B9FE4; color: #fff; cursor: pointer; }
        .continuer-btn.correct { background: #00c97a; color: #fff; cursor: pointer; }
        .continuer-btn.incorrect { background: #ff4757; color: #fff; cursor: pointer; }
    </style>
</head>
<body>

    <!-- BARRE DU HAUT -->
    <div class="top-bar" id="topBar">
        <a class="close-btn" href="ia.html">✕</a>
        <div class="progress-bar">
            <div class="progress-fill" id="progress"></div>
        </div>
        <div class="credits" id="credits">⚡ 100%</div>
    </div>

    <!-- NIVEAU -->
    <div class="niveau-badge" id="niveauBadge">⭐ Niveau 1</div>

    <!-- TYPE -->
    <div class="exercice-type" id="exerciceType">
        <div class="type-icon">📝</div>
        <div class="type-label">Choix multiple</div>
    </div>

    <!-- COQ + QUESTION -->
    <div class="question-section" id="questionSection">
        <div class="coq">🐓</div>
        <div class="question-bubble">
            <div class="question-text" id="questionText"></div>
        </div>
    </div>

    <!-- RÉPONSES -->
    <div class="reponses" id="reponses"></div>

    <!-- FEEDBACK -->
    <div class="feedback" id="feedback"></div>

    <!-- RÉSULTAT FINAL -->
    <div class="resultat" id="resultat">
        <div class="resultat-coq" id="resultatCoq">🎉</div>
        <div class="resultat-titre" id="resultatTitre">Session terminée !</div>
        <div class="resultat-score" id="resultatScore"></div>
        <div class="resultat-niveau" id="resultatNiveau"></div>
        <button class="btn-recommencer" onclick="recommencer()">🔄 Recommencer</button>
        <a class="btn-retour" href="ia.html">← Retour au chapitre</a>
    </div>

    <!-- BOUTON CONTINUER -->
    <div class="bottom-bar" id="bottomBar">
        <button class="continuer-btn" id="continuer" onclick="continuer()">CONTINUER</button>
    </div>

    <script>
        // ── DONNÉES ──────────────────────────────────────────

        const questionsParNiveau = {
    1: [
        {
            question: "Combien fait ¼ + ¼ ?",
            reponses: ["¼", "½", "1", "2"],
            bonne: 1,
            explication: "On additionne les numérateurs (les chiffres du haut) : 1+1=2. Le dénominateur (le chiffre du bas) ne change pas : il reste 4. On obtient 2/4. Maintenant on simplifie : 2/4 = ½ car 2 et 4 se divisent tous les deux par 2. On simplifie toujours pour avoir la fraction la plus petite possible — c'est la convention en mathématiques."
        },
        {
            question: "Quelle fraction est la plus grande : ½ ou ¼ ?",
            reponses: ["¼", "½", "Elles sont égales", "Je sais pas"],
            bonne: 1,
            explication: "Imagine une pizza entière. Si tu la coupes en 2 parts égales, chaque part est ½ — une grosse part. Si tu la coupes en 4 parts égales, chaque part est ¼ — une plus petite part. Donc ½ > ¼. La règle : plus le dénominateur est grand, plus la fraction est petite."
        },
        {
            question: "Combien font 2/4 simplifiés ?",
            reponses: ["1/4", "1/2", "2/2", "3/4"],
            bonne: 1,
            explication: "Simplifier une fraction ne change pas sa valeur — c'est juste une façon plus simple de l'écrire. 2/4 et ½ représentent exactement la même quantité. Pour simplifier on cherche un nombre qui divise à la fois le numérateur (2) et le dénominateur (4). Ce nombre c'est 2. Donc 2÷2=1 et 4÷2=2, ce qui donne ½."
        }
    ],
    2: [
        {
            question: "Combien fait ¾ + ¼ ?",
            reponses: ["½", "1", "2", "¼"],
            bonne: 1,
            explication: "Les dénominateurs sont identiques (4) donc on additionne juste les numérateurs : 3+1=4. On obtient 4/4. Or 4/4 signifie qu'on a 4 parts sur 4 — c'est-à-dire la totalité, donc 1 entier. C'est pourquoi on écrit 1 et non pas 4/4."
        },
        {
            question: "Combien fait ⅔ + ⅓ ?",
            reponses: ["⅓", "⅔", "1", "2/6"],
            bonne: 2,
            explication: "Les dénominateurs sont identiques (3) donc on additionne les numérateurs : 2+1=3. On obtient 3/3. Comme 4/4 vaut 1 entier, 3/3 vaut aussi 1 entier car on a toutes les parts. On écrit donc 1 et non 3/3."
        },
        {
            question: "Simplifie 6/8",
            reponses: ["2/4", "3/4", "1/2", "4/6"],
            bonne: 1,
            explication: "Pour simplifier 6/8 on cherche le plus grand nombre qui divise à la fois 6 et 8. Les diviseurs de 6 sont : 1, 2, 3, 6. Les diviseurs de 8 sont : 1, 2, 4, 8. Le plus grand commun est 2. Donc 6÷2=3 et 8÷2=4, ce qui donne ¾. On ne peut plus simplifier ¾ car 3 et 4 n'ont pas de diviseur commun sauf 1."
        }
    ],
    3: [
        {
            question: "Combien fait ½ + ⅓ ?",
            reponses: ["2/5", "5/6", "⅔", "1"],
            bonne: 1,
            explication: "Les dénominateurs sont différents (2 et 3) donc on ne peut pas additionner directement. Il faut d'abord trouver un dénominateur commun — le plus petit multiple commun de 2 et 3 est 6. On convertit : ½ = 3/6 (on multiplie en haut et en bas par 3) et ⅓ = 2/6 (on multiplie en haut et en bas par 2). Puis on additionne : 3/6 + 2/6 = 5/6."
        },
        {
            question: "Combien fait ¾ - ¼ ?",
            reponses: ["¼", "½", "⅔", "1"],
            bonne: 1,
            explication: "Les dénominateurs sont identiques (4) donc on soustrait les numérateurs : 3-1=2. On obtient 2/4. On simplifie ensuite : 2 et 4 se divisent tous les deux par 2, donc 2÷2=1 et 4÷2=2, ce qui donne ½. On simplifie toujours le résultat final."
        },
        {
            question: "Quelle est la forme simplifiée de 9/12 ?",
            reponses: ["2/3", "3/4", "4/6", "1/2"],
            bonne: 1,
            explication: "Pour simplifier 9/12 on cherche le plus grand diviseur commun. Les diviseurs de 9 : 1, 3, 9. Les diviseurs de 12 : 1, 2, 3, 4, 6, 12. Le plus grand commun est 3. Donc 9÷3=3 et 12÷3=4, ce qui donne ¾. On vérifie : 3 et 4 n'ont pas de diviseur commun sauf 1, donc ¾ est bien la forme la plus simplifiée."
        }
    ]
}



        // ── ÉTAT ─────────────────────────────────────────────

        let niveau = 1
        let questionIndex = 0
        let bonnesReponses = 0
        let totalQuestions = 0
        let bonnesConsecutives = 0
        let repondu = false
        let credits = parseInt(localStorage.getItem('credits') || '100')
        const estPremium = false // à changer quand Supabase sera connecté
        const QUESTIONS_PAR_SESSION = 5

        // ── INITIALISATION ────────────────────────────────────

        function init() {
            afficherCredits()
            afficherQuestion()
        }

        // ── CRÉDITS ───────────────────────────────────────────

        function afficherCredits() {
            if (estPremium) {
                document.getElementById('credits').innerHTML = '⚡ ∞'
                document.getElementById('credits').style.background = '#e8faf2'
                document.getElementById('credits').style.borderColor = '#00c97a'
                document.getElementById('credits').style.color = '#00a060'
            } else {
                document.getElementById('credits').innerHTML = `⚡ ${credits}%`
            }
        }

        function diminuerCredits() {
            if (estPremium) return
            credits = Math.max(0, credits - 10)
            localStorage.setItem('credits', credits)
            afficherCredits()
        }

        // ── QUESTIONS ─────────────────────────────────────────

        function getQuestion() {
            let pool = questionsParNiveau[niveau] || questionsParNiveau[3]
            return pool[questionIndex % pool.length]
        }

        function afficherQuestion() {
            if (totalQuestions >= QUESTIONS_PAR_SESSION) {
                afficherResultat()
                return
            }

            repondu = false
            let q = getQuestion()

            // Progression
            let pct = (totalQuestions / QUESTIONS_PAR_SESSION) * 100
            document.getElementById('progress').style.width = pct + '%'

            // Niveau
            document.getElementById('niveauBadge').innerHTML = `${'⭐'.repeat(niveau)} Niveau ${niveau}`

            // Question
            document.getElementById('questionText').textContent = q.question

            // Réponses
            let reponsesDiv = document.getElementById('reponses')
            reponsesDiv.innerHTML = ''
            q.reponses.forEach((rep, i) => {
                let btn = document.createElement('button')
                btn.className = 'reponse-btn'
                btn.textContent = rep
                btn.onclick = () => choisir(btn, i === q.bonne)
                reponsesDiv.appendChild(btn)
            })

            // Reset
            document.getElementById('feedback').className = 'feedback'
            document.getElementById('feedback').textContent = ''
            let continuer = document.getElementById('continuer')
            continuer.className = 'continuer-btn'
            continuer.textContent = 'CONTINUER'
        }

        // ── RÉPONSE ───────────────────────────────────────────

        function choisir(btn, estCorrecte) {
            if (repondu) return
            repondu = true
            totalQuestions++

            document.querySelectorAll('.reponse-btn').forEach(b => b.disabled = true)

            let feedback = document.getElementById('feedback')
            let continuer = document.getElementById('continuer')

            if (estCorrecte) {
                btn.classList.add('correct')
                bonnesReponses++
                bonnesConsecutives++

                feedback.textContent = bonnesConsecutives >= 2
                    ? '🔥 Excellent ! Tu enchaînes les bonnes réponses !'
                    : '✅ Bravo ! C\'est la bonne réponse !'
                feedback.className = 'feedback correct'
                continuer.className = 'continuer-btn correct'

                // Montée de niveau après 2 bonnes consécutives
                if (bonnesConsecutives >= 2 && niveau < 3) {
                    niveau++
                    bonnesConsecutives = 0
                    feedback.textContent += ` 🚀 Niveau ${niveau} débloqué !`
                }

            } else {
                btn.classList.add('incorrect')
                bonnesConsecutives = 0

                // Montrer la bonne réponse
                let q = getQuestion()
                document.querySelectorAll('.reponse-btn')[q.bonne].classList.add('correct')

                feedback.innerHTML = `❌ <strong>La bonne réponse était "${q.reponses[q.bonne]}"</strong><br><br>💡 ${q.explication}`
                feedback.className = 'feedback incorrect'
                continuer.className = 'continuer-btn incorrect'
            }

            questionIndex++
        }

        // ── CONTINUER ─────────────────────────────────────────

        function continuer() {
            if (!repondu) return
            afficherQuestion()
        }

        // ── RÉSULTAT FINAL ────────────────────────────────────

        function afficherResultat() {
            document.getElementById('topBar').style.display = 'none'
            document.getElementById('niveauBadge').style.display = 'none'
            document.getElementById('exerciceType').style.display = 'none'
            document.getElementById('questionSection').style.display = 'none'
            document.getElementById('reponses').style.display = 'none'
            document.getElementById('feedback').style.display = 'none'
            document.getElementById('bottomBar').style.display = 'none'

            let resultat = document.getElementById('resultat')
            resultat.classList.add('show')

            let pct = Math.round((bonnesReponses / QUESTIONS_PAR_SESSION) * 100)

            if (pct >= 80) {
                document.getElementById('resultatCoq').textContent = '🎉'
                document.getElementById('resultatTitre').textContent = 'Excellent travail !'
            } else if (pct >= 60) {
                document.getElementById('resultatCoq').textContent = '👍'
                document.getElementById('resultatTitre').textContent = 'Bien joué !'
            } else {
                document.getElementById('resultatCoq').textContent = '💪'
                document.getElementById('resultatTitre').textContent = 'Continue comme ça !'
            }

            document.getElementById('resultatScore').textContent =
                `${bonnesReponses} bonnes réponses sur ${QUESTIONS_PAR_SESSION}`

            document.getElementById('resultatNiveau').textContent =
                `Tu termines au Niveau ${niveau} ${'⭐'.repeat(niveau)}`

            // Diminuer les crédits à la fin de la session
            diminuerCredits()
        }

        // ── RECOMMENCER ───────────────────────────────────────

        function recommencer() {
            niveau = 1
            questionIndex = 0
            bonnesReponses = 0
            totalQuestions = 0
            bonnesConsecutives = 0

            document.getElementById('topBar').style.display = 'flex'
            document.getElementById('niveauBadge').style.display = 'inline-flex'
            document.getElementById('exerciceType').style.display = 'flex'
            document.getElementById('questionSection').style.display = 'flex'
            document.getElementById('reponses').style.display = 'flex'
            document.getElementById('bottomBar').style.display = 'block'
            document.getElementById('resultat').classList.remove('show')

            afficherQuestion()
        }

        // ── LANCEMENT ─────────────────────────────────────────
        init()
    </script>

</body>
</html>
