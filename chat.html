<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EPPIA - Chat IA</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Nunito', sans-serif; }

        body {
            background: #f5f5f5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            max-width: 500px;
            margin: 0 auto;
        }

        .header {
            background: #6B9FE4;
            padding: 44px 14px 14px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-radius: 0 0 20px 20px;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .back-btn {
            background: rgba(255,255,255,0.25);
            border: none;
            border-radius: 12px;
            padding: 8px 12px;
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            font-weight: 900;
            text-decoration: none;
        }

        .header-info { flex: 1; }
        .header-title { font-size: 16px; font-weight: 900; color: #fff; }
        .header-sub { font-size: 11px; color: rgba(255,255,255,0.75); font-weight: 700; }
        .coq-avatar { font-size: 32px; }

        .credits-bar {
            padding: 6px 16px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 6px;
            font-size: 11px;
            font-weight: 700;
            color: #e8a000;
        }

        .messages {
            flex: 1;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            overflow-y: auto;
            padding-bottom: 140px;
        }

        .message {
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }

        .message.ia { align-self: flex-start; max-width: 85%; }
        .message.eleve { align-self: flex-end; flex-direction: row-reverse; max-width: 85%; }

        .message-avatar { font-size: 24px; flex-shrink: 0; }

        .message-bubble {
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 14px;
            font-weight: 600;
            line-height: 1.5;
        }

        .message.ia .message-bubble {
            background: #fff;
            color: #333;
            border-bottom-left-radius: 4px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .message.eleve .message-bubble {
            background: #6B9FE4;
            color: #fff;
            border-bottom-right-radius: 4px;
        }

        .suggestions {
            padding: 0 16px 8px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .suggestion-btn {
            background: #fff;
            border: 2px solid #6B9FE4;
            border-radius: 20px;
            padding: 8px 14px;
            font-size: 12px;
            font-weight: 700;
            color: #6B9FE4;
            cursor: pointer;
            font-family: 'Nunito', sans-serif;
            transition: all 0.15s;
        }

        .suggestion-btn:hover { background: #6B9FE4; color: #fff; }

        .input-bar {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 500px;
            background: #fff;
            border-top: 1px solid #eee;
            padding: 12px 16px;
            display: flex;
            gap: 10px;
            align-items: center;
            z-index: 10;
        }

        .input-field {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 24px;
            font-size: 14px;
            font-family: 'Nunito', sans-serif;
            font-weight: 600;
            outline: none;
            color: #333;
        }

        .input-field:focus { border-color: #6B9FE4; }

        .send-btn {
            width: 44px;
            height: 44px;
            background: #6B9FE4;
            border: none;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
        }

        .send-btn svg {
            width: 20px;
            height: 20px;
            stroke: #fff;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .typing {
            display: flex;
            gap: 4px;
            padding: 12px 16px;
            background: #fff;
            border-radius: 18px;
            border-bottom-left-radius: 4px;
            width: fit-content;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .typing span {
            width: 8px;
            height: 8px;
            background: #bbb;
            border-radius: 50%;
            animation: typing 1.2s infinite;
        }

        .typing span:nth-child(2) { animation-delay: 0.2s; }
        .typing span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-6px); }
        }
    </style>
</head>
<body>

    <div class="header">
        <a class="back-btn" href="ia.html">←</a>
        <div class="header-info">
            <div class="header-title">Explication IA</div>
            <div class="header-sub">Les fractions · Mathématiques</div>
        </div>
        <div class="coq-avatar">🐓</div>
    </div>

    <div class="credits-bar" id="creditsBar">⚡ 100%</div>

    <div class="messages" id="messages"></div>

    <div class="suggestions" id="suggestions">
        <button class="suggestion-btn" onclick="envoyer('Je ne comprends pas encore')">Je ne comprends pas</button>
        <button class="suggestion-btn" onclick="envoyer('Donne moi un exemple')">Un exemple</button>
        <button class="suggestion-btn" onclick="envoyer('Je veux faire des exercices')">Faire des exercices</button>
    </div>

    <div class="input-bar">
        <input class="input-field" id="input" placeholder="Pose ta question..."
            onkeypress="if(event.key==='Enter') envoyer()">
        <button class="send-btn" onclick="envoyer()">
            <svg viewBox="0 0 24 24">
                <line x1="22" y1="2" x2="11" y2="13"/>
                <polygon points="22 2 15 22 11 13 2 9 22 2"/>
            </svg>
        </button>
    </div>

    <script>
        const estPremium = false
        let credits = parseInt(localStorage.getItem('credits') || '100')

        // ── RÉPONSES SIMULÉES ─────────────────────────────────
        const reponses = [
            {
                mots: ['fraction', 'fractions', 'c\'est quoi', 'kesako', 'définition'],
                reponse: `Une fraction c'est une façon d'écrire une division. Par exemple ½ ça veut dire 1 divisé par 2. Le chiffre du haut s'appelle le numérateur et le chiffre du bas le dénominateur. Imagine une pizza coupée en parts égales — si tu manges 1 part sur 4, tu as mangé ¼ de la pizza ! 🐓`
            },
            {
                mots: ['additionner', 'addition', 'ajouter', '+', 'plus'],
                reponse: `Pour additionner des fractions il faut que les dénominateurs soient identiques. Si c'est le cas, tu additionnes juste les numérateurs ! Par exemple ¼ + ¼ = 2/4 = ½. Si les dénominateurs sont différents, comme ½ + ⅓, il faut d'abord les mettre au même dénominateur. Le plus petit commun multiple de 2 et 3 est 6, donc ½ = 3/6 et ⅓ = 2/6, et 3/6 + 2/6 = 5/6 🐓`
            },
            {
                mots: ['simplifier', 'simplification', 'réduire', 'simple'],
                reponse: `Simplifier une fraction ça veut dire l'écrire de la façon la plus simple possible, sans changer sa valeur. Par exemple 2/4 = ½ — c'est la même chose ! Pour simplifier tu cherches le plus grand nombre qui divise à la fois le numérateur et le dénominateur. Pour 6/8, ce nombre c'est 2 : 6÷2=3 et 8÷2=4, donc 6/8 = ¾ 🐓`
            },
            {
                mots: ['soustraire', 'soustraction', '-', 'moins'],
                reponse: `La soustraction de fractions fonctionne comme l'addition — il faut le même dénominateur. Si les dénominateurs sont identiques, tu soustrais les numérateurs. Par exemple ¾ - ¼ = 2/4 = ½. Si les dénominateurs sont différents, tu les mets au même dénominateur d'abord 🐓`
            },
            {
                mots: ['multiplier', 'multiplication', 'fois', 'x'],
                reponse: `Pour multiplier des fractions c'est beaucoup plus simple ! Tu multiplies les numérateurs entre eux et les dénominateurs entre eux. Par exemple ½ × ⅓ = 1×1 / 2×3 = 1/6. Pas besoin de chercher un dénominateur commun ! 🐓`
            },
            {
                mots: ['diviser', 'division', 'partager', '÷'],
                reponse: `Pour diviser par une fraction, tu multiplies par son inverse ! Par exemple ½ ÷ ¼ = ½ × 4/1 = 4/2 = 2. L'inverse de ¼ c'est 4/1 — on retourne simplement la fraction. C'est le truc le plus important à retenir pour les divisions de fractions 🐓`
            },
            {
                mots: ['comprends pas', 'je comprends pas', 'pas compris', 'encore', 'autrement', 'différemment'],
                reponse: `Pas de panique ! Essaie d'imaginer une barre de chocolat. Si tu la coupes en 4 morceaux égaux, chaque morceau c'est ¼. Si tu en prends 3, tu as ¾. Les fractions c'est juste une façon de dire "combien de parts sur le total". Tu veux que j'explique une partie spécifique ? 🐓`
            },
            {
                mots: ['exemple', 'exemples', 'concret', 'application'],
                reponse: `Voilà des exemples du quotidien 🎯\n\n• Une demi-heure = ½ heure = 30 minutes\n• Un quart d'heure = ¼ heure = 15 minutes\n• Une pizza coupée en 8 : chaque part = 1/8\n• 3 parts de pizza = 3/8 de la pizza\n\nLes fractions sont partout dans la vie ! 🐓`
            },
            {
                mots: ['exercice', 'exercices', 'pratiquer', 'entraîner', 's\'entraîner'],
                reponse: `Super idée de vouloir pratiquer ! Clique sur le bouton "←" en haut puis choisis "Exercices progressifs" pour t'entraîner avec des questions qui s'adaptent à ton niveau. C'est le meilleur moyen de vraiment mémoriser 🐓`
            },
            {
                mots: ['merci', 'super', 'génial', 'top', 'bravo', 'cool'],
                reponse: `Avec plaisir ! Tu es vraiment courageux(se) de travailler tes maths. Continue comme ça et tu vas vite maîtriser les fractions 💪 Tu as d'autres questions ? 🐓`
            }
        ]

        const reponsesDefaut = [
            `Bonne question ! Pour les fractions, le plus important c'est de comprendre que c'est une division. Tu peux me préciser ce qui te bloque exactement ? 🐓`,
            `Je suis là pour t'aider ! Dis-moi exactement quelle partie des fractions te pose problème et je vais t'expliquer autrement 🐓`,
            `Hmm, laisse-moi t'expliquer ça différemment. Les fractions représentent des parties d'un tout. Tu veux un exemple avec quelque chose que tu connais bien ? 🐓`
        ]

        let reponsesDefautIndex = 0

        // ── CRÉDITS ───────────────────────────────────────────
        function afficherCredits() {
            let bar = document.getElementById('creditsBar')
            if (estPremium) {
                bar.innerHTML = '⚡ Premium — illimité'
                bar.style.color = '#00a060'
            } else {
                bar.innerHTML = `⚡ ${credits}% de crédits restants`
            }
        }

        function diminuerCredits() {
            if (estPremium) return
            credits = Math.max(0, credits - 5)
            localStorage.setItem('credits', credits)
            afficherCredits()
        }

        // ── MESSAGES ─────────────────────────────────────────
        function ajouterMessage(type, texte) {
            let messages = document.getElementById('messages')
            let div = document.createElement('div')
            div.className = `message ${type}`

            if (type === 'ia') {
                div.innerHTML = `
                    <div class="message-avatar">🐓</div>
                    <div class="message-bubble">${texte.replace(/\n/g, '<br>')}</div>
                `
            } else {
                div.innerHTML = `<div class="message-bubble">${texte}</div>`
            }

            messages.appendChild(div)
            messages.scrollTop = messages.scrollHeight
        }

        function afficherTyping() {
            let messages = document.getElementById('messages')
            let div = document.createElement('div')
            div.className = 'message ia'
            div.id = 'typing'
            div.innerHTML = `
                <div class="message-avatar">🐓</div>
                <div class="typing">
                    <span></span><span></span><span></span>
                </div>
            `
            messages.appendChild(div)
            messages.scrollTop = messages.scrollHeight
        }

        // ── TROUVER RÉPONSE ───────────────────────────────────
        function trouverReponse(msg) {
            let msgLower = msg.toLowerCase()

            for (let r of reponses) {
                for (let mot of r.mots) {
                    if (msgLower.includes(mot)) {
                        return r.reponse
                    }
                }
            }

            let rep = reponsesDefaut[reponsesDefautIndex % reponsesDefaut.length]
            reponsesDefautIndex++
            return rep
        }

        // ── ENVOI ─────────────────────────────────────────────
        function envoyer(texte) {
            let input = document.getElementById('input')
            let msg = texte || input.value.trim()
            if (!msg) return

            if (!estPremium && credits <= 0) {
                ajouterMessage('ia', '⚡ Tu n\'as plus de crédits ! Lis une actualité pour en regagner 🐓')
                return
            }

            ajouterMessage('eleve', msg)
            input.value = ''

            afficherTyping()

            setTimeout(() => {
                document.getElementById('typing')?.remove()
                ajouterMessage('ia', trouverReponse(msg))
                diminuerCredits()
            }, 1200 + Math.random() * 800)
        }

        // ── INIT ──────────────────────────────────────────────
        afficherCredits()
        ajouterMessage('ia', `Salut ! Je suis là pour t'expliquer les fractions en Mathématiques. Qu'est-ce que tu ne comprends pas ? Pose-moi n'importe quelle question ! 🐓`)
    </script>

</body>
</html>
