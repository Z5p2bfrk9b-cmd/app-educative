<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EPPIA - Chat IA</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Nunito', sans-serif; }

        body {
            background: #f5f5f5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            max-width: 500px;
            margin: 0 auto;
        }

        .header {
            background: #6B9FE4;
            padding: 26x 14px 14px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-radius: 0 0 18px 18px;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .back-btn {
            background: rgba(255,255,255,0.25);
            border: none;
            border-radius: 12px;
            padding: 8px 12px;
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            font-weight: 900;
            text-decoration: none;
        }

        .header-info { flex: 1; }
        .header-title { font-size: 16px; font-weight: 900; color: #fff; }
        .header-sub { font-size: 11px; color: rgba(255,255,255,0.75); font-weight: 700; }
        .coq-avatar { font-size: 32px; }

        .credits-bar {
            padding: 6px 16px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 6px;
            font-size: 11px;
            font-weight: 700;
            color: #e8a000;
            background: #f5f5f5;
        }

        .messages {
            flex: 1;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            overflow-y: auto;
            padding-bottom: 200px;
        }

        .message {
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }

        .message.ia { align-self: flex-start; max-width: 85%; }
        .message.eleve { align-self: flex-end; flex-direction: row-reverse; max-width: 85%; }

        .message-avatar { font-size: 24px; flex-shrink: 0; }

        .message-bubble {
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 14px;
            font-weight: 600;
            line-height: 1.5;
        }

        .message.ia .message-bubble {
            background: #fff;
            color: #333;
            border-bottom-left-radius: 4px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .message.eleve .message-bubble {
            background: #6B9FE4;
            color: #fff;
            border-bottom-right-radius: 4px;
        }

        .message-photo {
            max-width: 200px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            display: block;
        }

        /* SUGGESTIONS */
        .suggestions-wrapper {
            position: fixed;
            bottom: 76px;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 500px;
            background: #f5f5f5;
            padding: 8px 16px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            z-index: 9;
        }

        .suggestion-btn {
            background: #fff;
            border: 2px solid #6B9FE4;
            border-radius: 20px;
            padding: 7px 12px;
            font-size: 12px;
            font-weight: 700;
            color: #6B9FE4;
            cursor: pointer;
            font-family: 'Nunito', sans-serif;
            transition: all 0.15s;
            white-space: nowrap;
        }

        .suggestion-btn:hover { background: #6B9FE4; color: #fff; }

        /* INPUT BAR */
        .input-bar {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 500px;
            background: #fff;
            border-top: 1px solid #eee;
            padding: 10px 16px 16px;
            display: flex;
            gap: 8px;
            align-items: center;
            z-index: 10;
        }

        .photo-btn {
            width: 42px;
            height: 42px;
            background: #f0f0f0;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            cursor: pointer;
            flex-shrink: 0;
            border: none;
        }

        .photo-btn:hover { background: #e0e0e0; }

        .input-field {
            flex: 1;
            padding: 11px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 24px;
            font-size: 14px;
            font-family: 'Nunito', sans-serif;
            font-weight: 600;
            outline: none;
            color: #333;
            background: #f9f9f9;
        }

        .input-field:focus {
            border-color: #6B9FE4;
            background: #fff;
        }

        .send-btn {
            width: 42px;
            height: 42px;
            background: #6B9FE4;
            border: none;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            transition: background 0.15s;
        }

        .send-btn:hover { background: #5a8ed3; }

        .send-btn:disabled { background: #ccc; cursor: not-allowed; }

        .send-btn svg {
            width: 18px;
            height: 18px;
            stroke: #fff;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* TYPING */
        .typing {
            display: flex;
            gap: 4px;
            padding: 12px 16px;
            background: #fff;
            border-radius: 18px;
            border-bottom-left-radius: 4px;
            width: fit-content;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .typing span {
            width: 8px;
            height: 8px;
            background: #bbb;
            border-radius: 50%;
            animation: typing 1.2s infinite;
        }

        .typing span:nth-child(2) { animation-delay: 0.2s; }
        .typing span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-6px); }
        }

        /* PLUS DE CRÉDITS */
        .no-credits {
            background: #fff8e0;
            border: 2px solid #ffd080;
            border-radius: 16px;
            padding: 12px 16px;
            margin: 0 16px;
            text-align: center;
            font-size: 13px;
            font-weight: 700;
            color: #e8a000;
            display: none;
        }

        .no-credits.show { display: block; }

        .no-credits a {
            color: #6B9FE4;
            font-weight: 900;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <div class="header">
        <a class="back-btn" href="ia.html">←</a>
        <div class="header-info">
            <div class="header-title">Explication IA</div>
            <div class="header-sub">Les fractions · Mathématiques</div>
        </div>
        <div class="coq-avatar">🐓</div>
    </div>

    <!-- CRÉDITS -->
    <div class="credits-bar" id="creditsBar">⚡ 100% de crédits restants</div>

    <!-- MESSAGES -->
    <div class="messages" id="messages"></div>

    <!-- PLUS DE CRÉDITS -->
    <div class="no-credits" id="noCredits">
        ⚡ Tu n'as plus de crédits !
        <a href="actualites.html">Lis une actualité</a> pour en regagner.
    </div>

    <!-- SUGGESTIONS -->
    <div class="suggestions-wrapper" id="suggestions">
        <button class="suggestion-btn" onclick="envoyer('Je ne comprends pas encore, explique autrement')">
            Explique autrement
        </button>
        <button class="suggestion-btn" onclick="envoyer('Donne moi un exemple concret')">
            Un exemple
        </button>
        <button class="suggestion-btn" onclick="envoyer('Je veux faire des exercices')">
            Faire des exercices
        </button>
    </div>

    <!-- INPUT BAR -->
    <div class="input-bar">
        <label class="photo-btn" for="photoInput" title="Envoyer une photo de ton cours">
            📷
        </label>
        <input type="file" id="photoInput" accept="image/*"
            style="display:none" onchange="envoyerPhoto(this)">

        <input class="input-field" id="input"
            placeholder="Pose ta question..."
            onkeypress="if(event.key==='Enter') envoyer()">

        <button class="send-btn" id="sendBtn" onclick="envoyer()">
            <svg viewBox="0 0 24 24">
                <line x1="22" y1="2" x2="11" y2="13"/>
                <polygon points="22 2 15 22 11 13 2 9 22 2"/>
            </svg>
        </button>
    </div>

    <script>
        const estPremium = false
        let credits = parseInt(localStorage.getItem('credits') || '100')
        let reponsesDefautIndex = 0

        // ── RÉPONSES SIMULÉES ─────────────────────────────────
        const reponses = [
            {
                mots: ['fraction', 'fractions', 'c\'est quoi', 'définition'],
                reponse: `Une fraction c'est une façon d'écrire une division. Par exemple ½ ça veut dire 1 divisé par 2. Le chiffre du haut s'appelle le numérateur et le chiffre du bas le dénominateur. Imagine une pizza coupée en parts égales — si tu manges 1 part sur 4, tu as mangé ¼ de la pizza ! 🐓`
            },
            {
                mots: ['additionner', 'addition', 'ajouter', 'plus'],
                reponse: `Pour additionner des fractions il faut que les dénominateurs soient identiques. Si c'est le cas, tu additionnes juste les numérateurs ! Par exemple ¼ + ¼ = 2/4 = ½. Si les dénominateurs sont différents, comme ½ + ⅓, il faut trouver un dénominateur commun. Le plus petit commun multiple de 2 et 3 est 6, donc ½ = 3/6 et ⅓ = 2/6, et 3/6 + 2/6 = 5/6 🐓`
            },
            {
                mots: ['simplifier', 'simplification', 'réduire'],
                reponse: `Simplifier une fraction ça veut dire l'écrire de la façon la plus simple possible, sans changer sa valeur. Par exemple 2/4 = ½ — c'est la même chose ! Pour simplifier tu cherches le plus grand nombre qui divise à la fois le numérateur et le dénominateur. Pour 6/8, ce nombre c'est 2 : 6÷2=3 et 8÷2=4, donc 6/8 = ¾ 🐓`
            },
            {
                mots: ['soustraire', 'soustraction', 'moins'],
                reponse: `La soustraction de fractions fonctionne comme l'addition — il faut le même dénominateur. Par exemple ¾ - ¼ = 2/4 = ½. Si les dénominateurs sont différents, tu les mets au même dénominateur d'abord 🐓`
            },
            {
                mots: ['multiplier', 'multiplication', 'fois'],
                reponse: `Pour multiplier des fractions c'est simple ! Tu multiplies les numérateurs entre eux et les dénominateurs entre eux. Par exemple ½ × ⅓ = 1×1 / 2×3 = 1/6. Pas besoin de chercher un dénominateur commun ! 🐓`
            },
            {
                mots: ['diviser', 'division', 'partager'],
                reponse: `Pour diviser par une fraction, tu multiplies par son inverse ! Par exemple ½ ÷ ¼ = ½ × 4/1 = 4/2 = 2. L'inverse de ¼ c'est 4/1 — on retourne simplement la fraction 🐓`
            },
            {
                mots: ['comprends pas', 'pas compris', 'encore', 'autrement', 'différemment'],
                reponse: `Pas de panique ! Essaie d'imaginer une barre de chocolat. Si tu la coupes en 4 morceaux égaux, chaque morceau c'est ¼. Si tu en prends 3, tu as ¾. Les fractions c'est juste une façon de dire "combien de parts sur le total". Tu veux que j'explique une partie spécifique ? 🐓`
            },
            {
                mots: ['exemple', 'concret'],
                reponse: `Voilà des exemples du quotidien 🎯\n\n• Une demi-heure = ½ heure = 30 minutes\n• Un quart d'heure = ¼ heure = 15 minutes\n• Une pizza coupée en 8 : chaque part = 1/8\n• 3 parts de pizza = 3/8 de la pizza\n\nLes fractions sont partout dans la vie ! 🐓`
            },
            {
                mots: ['exercice', 'exercices', 'pratiquer', 'entraîner'],
                reponse: `Super idée ! Clique sur "←" en haut puis choisis "Exercices progressifs" pour t'entraîner avec des questions qui s'adaptent à ton niveau 🐓`
            },
            {
                mots: ['merci', 'super', 'génial', 'top', 'cool'],
                reponse: `Avec plaisir ! Tu es vraiment courageux(se) de travailler tes maths. Continue comme ça et tu vas vite maîtriser les fractions 💪 Tu as d'autres questions ? 🐓`
            },
            {
                mots: ['photo', 'image', 'cours', 'feuille'],
                reponse: `J'ai bien reçu ton cours ! Dis-moi quelle partie tu ne comprends pas et je vais t'expliquer étape par étape 🐓`
            }
        ]

        const reponsesDefaut = [
            `Bonne question ! Dis-moi exactement quelle partie des fractions te bloque et je t'explique autrement 🐓`,
            `Je suis là pour t'aider ! Précise-moi ce qui te pose problème et on va démêler ça ensemble 🐓`,
            `Hmm, laisse-moi t'expliquer différemment. Tu veux un exemple concret pour mieux comprendre ? 🐓`
        ]

        // ── CRÉDITS ───────────────────────────────────────────
        function afficherCredits() {
            let bar = document.getElementById('creditsBar')
            let noCredits = document.getElementById('noCredits')

            if (estPremium) {
                bar.innerHTML = '⚡ Premium — crédits illimités'
                bar.style.color = '#00a060'
                return
            }

            bar.innerHTML = `⚡ ${credits}% de crédits restants`

            if (credits <= 0) {
                bar.style.color = '#ff4757'
                noCredits.classList.add('show')
                document.getElementById('sendBtn').disabled = true
                document.getElementById('input').disabled = true
                document.getElementById('input').placeholder = 'Plus de crédits...'
            } else if (credits <= 20) {
                bar.style.color = '#ff4757'
            } else {
                bar.style.color = '#e8a000'
            }
        }

        function diminuerCredits() {
            if (estPremium) return
            credits = Math.max(0, credits - 5)
            localStorage.setItem('credits', credits)
            afficherCredits()
        }

        // ── MESSAGES ─────────────────────────────────────────
        function ajouterMessage(type, texte) {
            let messages = document.getElementById('messages')
            let div = document.createElement('div')
            div.className = `message ${type}`

            if (type === 'ia') {
                div.innerHTML = `
                    <div class="message-avatar">🐓</div>
                    <div class="message-bubble">${texte.replace(/\n/g, '<br>')}</div>
                `
            } else {
                div.innerHTML = `<div class="message-bubble">${texte}</div>`
            }

            messages.appendChild(div)
            messages.scrollTop = messages.scrollHeight
        }

        function afficherTyping() {
            let messages = document.getElementById('messages')
            let div = document.createElement('div')
            div.className = 'message ia'
            div.id = 'typing'
            div.innerHTML = `
                <div class="message-avatar">🐓</div>
                <div class="typing">
                    <span></span><span></span><span></span>
                </div>
            `
            messages.appendChild(div)
            messages.scrollTop = messages.scrollHeight
        }

        // ── TROUVER RÉPONSE ───────────────────────────────────
        function trouverReponse(msg) {
            let msgLower = msg.toLowerCase()
            for (let r of reponses) {
                for (let mot of r.mots) {
                    if (msgLower.includes(mot)) return r.reponse
                }
            }
            let rep = reponsesDefaut[reponsesDefautIndex % reponsesDefaut.length]
            reponsesDefautIndex++
            return rep
        }

        // ── ENVOI TEXTE ───────────────────────────────────────
        function envoyer(texte) {
            if (!estPremium && credits <= 0) return

            let input = document.getElementById('input')
            let msg = texte || input.value.trim()
            if (!msg) return

            ajouterMessage('eleve', msg)
            input.value = ''

            document.getElementById('sendBtn').disabled = true
            afficherTyping()

            setTimeout(() => {
                document.getElementById('typing')?.remove()
                ajouterMessage('ia', trouverReponse(msg))
                diminuerCredits()
                document.getElementById('sendBtn').disabled = false
            }, 1000 + Math.random() * 800)
        }

        // ── ENVOI PHOTO ───────────────────────────────────────
        function envoyerPhoto(input) {
            if (!estPremium && credits <= 0) return

            let file = input.files[0]
            if (!file) return

            let reader = new FileReader()
            reader.onload = function(e) {
                let messages = document.getElementById('messages')
                let div = document.createElement('div')
                div.className = 'message eleve'
                div.innerHTML = `
                    <img src="${e.target.result}" class="message-photo" alt="Photo du cours">
                `
                messages.appendChild(div)
                messages.scrollTop = messages.scrollHeight

                afficherTyping()
                setTimeout(() => {
                    document.getElementById('typing')?.remove()
                    ajouterMessage('ia',
                        `Je vois ton cours ! Dis-moi quelle partie tu ne comprends pas et je vais t'expliquer étape par étape 🐓`
                    )
                    diminuerCredits()
                }, 1500)
            }
            reader.readAsDataURL(file)
            input.value = ''
        }

        // ── INIT ──────────────────────────────────────────────
        afficherCredits()
        ajouterMessage('ia',
            `Salut ! Je suis là pour t'expliquer les fractions en Mathématiques. Tu peux me poser n'importe quelle question ou m'envoyer une photo de ton cours 📷 🐓`
        )
    </script>

</body>
</html>
