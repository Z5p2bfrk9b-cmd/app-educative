<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EPPIA - Chat IA</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Nunito', sans-serif; }

        body {
            background: #f5f5f5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            max-width: 500px;
            margin: 0 auto;
        }

        .header {
            background: #6B9FE4;
            padding: 44px 14px 14px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-radius: 0 0 20px 20px;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .back-btn {
            background: rgba(255,255,255,0.25);
            border: none;
            border-radius: 12px;
            padding: 8px 12px;
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            font-weight: 900;
            text-decoration: none;
        }

        .header-info { flex: 1; }

        .header-title {
            font-size: 16px;
            font-weight: 900;
            color: #fff;
        }

        .header-sub {
            font-size: 11px;
            color: rgba(255,255,255,0.75);
            font-weight: 700;
        }

        .coq-avatar { font-size: 32px; }

        .messages {
            flex: 1;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            overflow-y: auto;
            padding-bottom: 140px;
        }

        .message {
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }

        .message.ia {
            align-self: flex-start;
            max-width: 85%;
        }

        .message.eleve {
            align-self: flex-end;
            flex-direction: row-reverse;
            max-width: 85%;
        }

        .message-avatar {
            font-size: 24px;
            flex-shrink: 0;
        }

        .message-bubble {
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 14px;
            font-weight: 600;
            line-height: 1.5;
        }

        .message.ia .message-bubble {
            background: #fff;
            color: #333;
            border-bottom-left-radius: 4px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .message.eleve .message-bubble {
            background: #6B9FE4;
            color: #fff;
            border-bottom-right-radius: 4px;
        }

        .suggestions {
            padding: 0 16px 8px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .suggestion-btn {
            background: #fff;
            border: 2px solid #6B9FE4;
            border-radius: 20px;
            padding: 8px 14px;
            font-size: 12px;
            font-weight: 700;
            color: #6B9FE4;
            cursor: pointer;
            font-family: 'Nunito', sans-serif;
            transition: all 0.15s;
        }

        .suggestion-btn:hover {
            background: #6B9FE4;
            color: #fff;
        }

        .input-bar {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 500px;
            background: #fff;
            border-top: 1px solid #eee;
            padding: 12px 16px;
            display: flex;
            gap: 10px;
            align-items: center;
            z-index: 10;
        }

        .input-field {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 24px;
            font-size: 14px;
            font-family: 'Nunito', sans-serif;
            font-weight: 600;
            outline: none;
            color: #333;
        }

        .input-field:focus { border-color: #6B9FE4; }

        .send-btn {
            width: 44px;
            height: 44px;
            background: #6B9FE4;
            border: none;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
        }

        .send-btn svg {
            width: 20px;
            height: 20px;
            stroke: #fff;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .send-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .typing {
            display: flex;
            gap: 4px;
            padding: 12px 16px;
            background: #fff;
            border-radius: 18px;
            border-bottom-left-radius: 4px;
            width: fit-content;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .typing span {
            width: 8px;
            height: 8px;
            background: #bbb;
            border-radius: 50%;
            animation: typing 1.2s infinite;
        }

        .typing span:nth-child(2) { animation-delay: 0.2s; }
        .typing span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-6px); }
        }

        .credits-bar {
            padding: 6px 16px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 6px;
            font-size: 11px;
            font-weight: 700;
            color: #e8a000;
        }
    </style>
</head>
<body>

    <div class="header">
        <a class="back-btn" href="ia.html">←</a>
        <div class="header-info">
            <div class="header-title">Explication IA</div>
            <div class="header-sub" id="headerSub">Les fractions · Mathématiques</div>
        </div>
        <div class="coq-avatar">🐓</div>
    </div>

    <div class="credits-bar" id="creditsBar">⚡ 100%</div>

    <div class="messages" id="messages"></div>

    <div class="suggestions" id="suggestions">
        <button class="suggestion-btn" onclick="envoyer('Je ne comprends pas encore, explique autrement')">Explique autrement</button>
        <button class="suggestion-btn" onclick="envoyer('Donne moi un exemple concret')">Un exemple</button>
        <button class="suggestion-btn" onclick="envoyer('Je veux faire des exercices')">Faire des exercices</button>
    </div>

    <div class="input-bar">
        <input class="input-field" id="input" placeholder="Pose ta question..." 
            onkeypress="if(event.key==='Enter') envoyer()">
        <button class="send-btn" id="sendBtn" onclick="envoyer()">
            <svg viewBox="0 0 24 24">
                <line x1="22" y1="2" x2="11" y2="13"/>
                <polygon points="22 2 15 22 11 13 2 9 22 2"/>
            </svg>
        </button>
    </div>

    <script>
        // ── CONFIG ────────────────────────────────────────────
        const CLE_API = 'cles' 
        const estPremium = false
        let credits = parseInt(localStorage.getItem('credits') || '100')

        // Contexte du chapitre — plus tard viendra de Supabase
        const contexte = {
            matiere: 'Mathématiques',
            chapitre: 'Les fractions',
            classe: '4ème',
            niveau: 'Je débute'
        }

        // Historique des messages pour OpenAI
        let historique = [
            {
                role: 'system',
                content: `Tu es EPPIA, un tuteur IA bienveillant et pédagogique pour les élèves français.
Tu aides un élève de ${contexte.classe} qui étudie "${contexte.chapitre}" en ${contexte.matiere}.
Son niveau sur ce chapitre : ${contexte.niveau}.
Règles importantes :
- Explique toujours simplement avec des exemples concrets
- Utilise des analogies du quotidien
- Si l'élève ne comprend pas, réexplique différemment
- Sois encourageant et positif
- Réponds en français
- Garde tes réponses courtes et claires (3-5 phrases max)
- Tu t'appelles EPPIA et tu utilises parfois 🐓 à la fin de tes messages`
            }
        ]

        // ── INIT ──────────────────────────────────────────────
        function init() {
            afficherCredits()
            document.getElementById('headerSub').textContent =
                `${contexte.chapitre} · ${contexte.matiere}`

            // Message de bienvenue
            ajouterMessage('ia',
                `Salut ! Je suis là pour t'expliquer ${contexte.chapitre} en ${contexte.matiere}. Qu'est-ce que tu ne comprends pas ? Pose-moi n'importe quelle question ! 🐓`
            )
        }

        // ── CRÉDITS ───────────────────────────────────────────
        function afficherCredits() {
            let bar = document.getElementById('creditsBar')
            if (estPremium) {
                bar.innerHTML = '⚡ Premium — illimité'
                bar.style.color = '#00a060'
            } else {
                bar.innerHTML = `⚡ ${credits}% de crédits restants`
            }
        }

        function diminuerCredits() {
            if (estPremium) return
            credits = Math.max(0, credits - 5)
            localStorage.setItem('credits', credits)
            afficherCredits()
        }

        // ── MESSAGES ─────────────────────────────────────────
        function ajouterMessage(type, texte) {
            let messages = document.getElementById('messages')
            let div = document.createElement('div')
            div.className = `message ${type}`

            if (type === 'ia') {
                div.innerHTML = `
                    <div class="message-avatar">🐓</div>
                    <div class="message-bubble">${texte}</div>
                `
            } else {
                div.innerHTML = `
                    <div class="message-bubble">${texte}</div>
                `
            }

            messages.appendChild(div)
            messages.scrollTop = messages.scrollHeight
        }

        function afficherTyping() {
            let messages = document.getElementById('messages')
            let div = document.createElement('div')
            div.className = 'message ia'
            div.id = 'typing'
            div.innerHTML = `
                <div class="message-avatar">🐓</div>
                <div class="typing">
                    <span></span><span></span><span></span>
                </div>
            `
            messages.appendChild(div)
            messages.scrollTop = messages.scrollHeight
        }

        // ── ENVOI ─────────────────────────────────────────────
        async function envoyer(texte) {
            let input = document.getElementById('input')
            let msg = texte || input.value.trim()
            if (!msg) return

            // Vérifier les crédits
            if (!estPremium && credits <= 0) {
                ajouterMessage('ia',
                    '⚡ Tu n\'as plus de crédits ! Lis une actualité pour en regagner 🐓'
                )
                return
            }

            // Afficher message élève
            ajouterMessage('eleve', msg)
            input.value = ''

            // Désactiver le bouton
            document.getElementById('sendBtn').disabled = true
            document.getElementById('suggestions').style.display = 'none'

            // Ajouter au historique
            historique.push({ role: 'user', content: msg })

            // Afficher typing
            afficherTyping()

            try {
                // Appel OpenAI
                const reponse = await fetch('https://api.anthropic.com/v1/messages', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-api-key': CLE_API,
                        'anthropic-version': '2023-06-01'
                    },
                    body: JSON.stringify({
                        model: 'claude-haiku-4-5-20251001',
                        max_tokens: 500,
                        system: historique[0].content,
                        messages: historique.slice(1)
                    })
                })

                let data = await reponse.json()
                let texteIA = data.content[0].text

                // Supprimer typing
                document.getElementById('typing')?.remove()

                // Afficher réponse
                ajouterMessage('ia', texteIA)

                // Ajouter au historique
                historique.push({ role: 'assistant', content: texteIA })

                // Diminuer crédits
                diminuerCredits()

            } catch (erreur) {
                document.getElementById('typing')?.remove()
                ajouterMessage('ia',
                    '😕 Oups, une erreur s\'est produite. Vérifie ta connexion et réessaie !'
                )
                console.error(erreur)
            }

            // Réactiver le bouton
            document.getElementById('sendBtn').disabled = false
            document.getElementById('suggestions').style.display = 'flex'
        }

        // ── LANCEMENT ─────────────────────────────────────────
        init()
    </script>

</body>
</html>
